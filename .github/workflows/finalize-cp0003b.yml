name: Finalize CP-0003B checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/logbook/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/**'
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/logbook/**'
      - 'android/pipeline/src/test/kotlin/dev/n0png/fieldops/android/logbook/**'
      - 'native/tqsl/**'
      - 'scripts/test_lotw_transaction.sh'
      - 'scripts/test_tqsl_signer.sh'
      - 'scripts/test_core_regression.sh'
      - 'scripts/finalize_cp0003b.py'
      - 'research/tqsl/**'
      - 'research/LOTW_INTEGRATION.md'
      - '.github/workflows/finalize-cp0003b.yml'

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run transaction-safe LoTW gate on merged main
        run: bash scripts/test_lotw_transaction.sh

  signer-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22 and native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0003A signer gate on merged main
        run: bash scripts/test_tqsl_signer.sh

  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run inherited core/LoTW regression on merged main
        run: bash scripts/test_core_regression.sh

  checkpoint:
    needs: [transaction, signer-regression, core-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0003b.py

      - name: Create immutable CP-0003B snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py             --root .             --id CP-0003B-LOTW_TRANSACTION_SAFE             --parent CP-0003A-TRUSTEDQSL_SIGNER             --summary "Transaction-safe LoTW sign-upload-acceptance-verify-commit path with one shared manual/digital queue"             --phase "LoTW transaction host-verified; real Android/device/account validation next"             --test-status "GREEN host/CI: transaction=53 signer=43 core=42062 pipeline=56 LoTW=19; real LoTW/device validation not run; finalizer run $FINALIZE_RUN_ID"             --source-pin "TrustedQSL-2.8.6@sha256:182e5f2ac35a3db8b409b45d96505e6bd265ae4668ed064754209c4b8e7bdf37"             --completed "Legacy one-shot signer/upload path retired in favor of TransactionalLotwSigner sessions"             --completed "Upload transaction is sign -> TQ8 upload -> accepted-QSO report verification -> TrustedQSL commit"             --completed "HTTP upload acceptance alone remains SUBMITTED and never implies QSO acceptance"             --completed "Signing, transport, non-2xx and acceptance-verification failures roll back without local ACCEPTED state"             --completed "LoTW endpoint rejection rolls back and is retained as REJECTED without automatic retry"             --completed "Full batch acceptance commits exactly once and retains available LoTW record metadata"             --completed "Mode-neutral LotwUploadQueue carries SSB, CW and digital QSOs through the same state machine"             --completed "Focused transaction PASS 53; signer PASS 43; inherited core PASS 42062, pipeline PASS 56 and LoTW PASS 19"             --blocker "Real LoTW network upload and accepted-QSO verification have not been executed with a real account"             --blocker "Official TrustedQSL dependency stack is not yet packaged for Android arm64-v8a"             --blocker "Real Callsign Certificate/private-key signing on the Galaxy S23 Ultra has not been validated"             --blocker "Automatic upload remains disabled pending CP-0003C"             --next "CP-0003C: package official TrustedQSL for Android arm64-v8a and validate on the Galaxy S23 Ultra"             --next "Use a controlled real Callsign Certificate/test QSO to execute sign-upload-accepted-report-commit and confirmation sync"             --next "Verify secret hygiene and keep automatic upload disabled unless every CP-0003C gate passes"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0003B-LOTW_TRANSACTION_SAFE.json
          git add -f checkpoints/snapshots/CP-0003B-LOTW_TRANSACTION_SAFE.tar.gz
          git commit -m "Checkpoint CP-0003B transaction-safe LoTW"
          git push
