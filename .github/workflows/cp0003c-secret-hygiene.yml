name: CP-0003C Secret Hygiene

on:
  workflow_dispatch:
  push:
    branches:
      - cp-0003c-real-lotw-validation
  pull_request:

permissions:
  contents: read

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run CP-0003C secret-hygiene gate
        shell: bash
        run: bash scripts/check_cp0003c_secret_hygiene.sh
