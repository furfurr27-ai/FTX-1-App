name: Finalize CP-0008N checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/PropagationReadModelConsistencyService.kt'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/PropagationRuntime.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/PropagationReadModelConsistencyTests.kt'
      - 'research/propagation/CP-0008N_READ_MODEL_CONSISTENCY_DIAGNOSTICS.md'
      - 'scripts/test_propagation_read_model_consistency.sh'
      - 'scripts/finalize_cp0008n.py'
      - '.github/workflows/cp0008n-propagation-read-model-consistency.yml'
      - '.github/workflows/finalize-cp0008n.yml'
      - '.github/workflows/finalize-cp0008m.yml'

permissions:
  contents: write

env:
  JAVA_OPTS: "-Xmx1536m -Xms128m"

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_propagation_read_model_consistency.sh

  inherited:
    name: inherited — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: operating-picture, script: scripts/test_propagation_operating_picture.sh}
          - {label: source-status, script: scripts/test_propagation_source_status_presentation.sh}
          - {label: state-persistence, script: scripts/test_propagation_refresh_state_persistence.sh}
          - {label: runtime, script: scripts/test_propagation_runtime_composition.sh}
          - {label: concrete-https, script: scripts/test_concrete_public_https_transport.sh}
          - {label: public-transport, script: scripts/test_public_propagation_transport_adapters.sh}
          - {label: refresh, script: scripts/test_propagation_refresh_coordinator.sh}
          - {label: projection, script: scripts/test_propagation_projection.sh}
          - {label: aggregation, script: scripts/test_propagation_aggregation_offline_cache.sh}
          - {label: psk-reporter, script: scripts/test_psk_reporter_heard_path_adapter.sh}
          - {label: glotec, script: scripts/test_glotec_ionospheric_adapter.sh}
          - {label: noaa-swpc, script: scripts/test_noaa_swpc_propagation_adapter.sh}
          - {label: propagation, script: scripts/test_propagation_foundation.sh}
          - {label: production-pack, script: scripts/test_production_us_state_geometry_pack.sh}
          - {label: geometry, script: scripts/test_award_geometry_providers.sh}
          - {label: map, script: scripts/test_award_area_map_projection.sh}
          - {label: extended, script: scripts/test_extended_award_catalog.sh}
          - {label: service, script: scripts/test_awards_center_application_service.sh}
          - {label: persistence, script: scripts/test_award_evidence_persistence.sh}
          - {label: awards-projection, script: scripts/test_awards_center_projection.sh}
          - {label: target, script: scripts/test_award_target_enrichment.sh}
          - {label: catalog, script: scripts/test_official_award_catalog.sh}
          - {label: award, script: scripts/test_award_evaluation.sh}
          - {label: queue, script: scripts/test_manual_qso_lotw_queue.sh}
          - {label: logger, script: scripts/test_universal_qso_logger.sh}
          - {label: lotw, script: scripts/test_lotw_transaction.sh}
          - {label: core, script: scripts/test_core_regression.sh}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash "${{ matrix.script }}"

  checkpoint:
    needs: [diagnostics, inherited]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Update durable handoff
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0008n.py
      - name: Create and verify immutable checkpoint
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0008N-PROPAGATION_READ_MODEL_CONSISTENCY_DIAGNOSTICS \
            --parent CP-0008M-PROPAGATION_OPERATING_PICTURE_READ_MODEL \
            --summary "Read-only propagation provenance and source/snapshot timing consistency diagnostics" \
            --phase "Propagation consistency diagnostics host-verified; offline report payload next; hardware/account deferred" \
            --test-status "GREEN host/CI: read_model_diagnostics=PASS operating_picture=PASS source_status=67 state_persistence=PASS runtime=67 concrete_https=70 public_transport=98 refresh=112 projection=79 aggregation=101 pskr=168 glotec=87 noaa=53 propagation=154 production_pack=363 geometry=102 map=96 extended=96 service=64 persistence=92 awards_projection=114 target=77 catalog=115 award=67 queue=47 logger=78 LoTW_transaction=53 core=42062; finalizer run $FINALIZE_RUN_ID" \
            --completed "Pure source/cache timeline diagnostics derived from already captured operating picture with no additional store/provider reads" \
            --completed "BEFORE EQUAL AFTER UNKNOWN comparisons with signed source-success versus cache and retrieval-versus-success timestamp deltas" \
            --completed "Explicit future-dated source attempts, provider retrievals, cache capture timestamps and nullable future snapshot age" \
            --completed "Preserved source-aware fresh aging stale future observation counts and workspace-filter independence" \
            --completed "Aggregate source timing-skew counts derived consistently and no cross-store transaction guarantee claimed" \
            --completed "Runtime diagnostics overloads tested with file-backed state/snapshot runtime recreation and no network" \
            --completed "Superseded CP-0008M finalizer set manual-only; full inherited CI matrix green" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return until owner explicitly says 'resume CP-0003C'" \
            --blocker "CP-0004A/B/C hardware checkpoints remain incomplete" \
            --blocker "Cross-store read atomicity unverified; no live provider, Android UI/lifecycle or phone/radio/RF proof" \
            --next "CP-0008O: deterministic propagation offline diagnostic report payload based on existing read-model output" \
            --next "Preserve provider/cache/refresh/assessment semantics; deterministic CI and source provenance" \
            --next "Keep hardware/account and Android work outside; CP-0003C remains DEFERRED"
          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit checkpoint
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0008N-PROPAGATION_READ_MODEL_CONSISTENCY_DIAGNOSTICS.json
          git add -f checkpoints/snapshots/CP-0008N-PROPAGATION_READ_MODEL_CONSISTENCY_DIAGNOSTICS.tar.gz
          git commit -m "Checkpoint CP-0008N propagation read-model consistency diagnostics"
          git push
