name: Finalize CP-0006B checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/awards/OfficialAwardCatalog.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/OfficialAwardCatalogTests.kt'
      - 'scripts/test_official_award_catalog.sh'
      - 'scripts/finalize_cp0006b.py'
      - 'research/awards/CP-0006B_OFFICIAL_AWARD_CATALOG.md'
      - 'research/awards/OFFICIAL_AWARD_SOURCES.tsv'
      - '.github/workflows/finalize-cp0006b.yml'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0006B catalog gate on merged main
        run: bash scripts/test_official_award_catalog.sh

  award-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0006A award evaluator
        run: bash scripts/test_award_evaluation.sh

  queue-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0005B queue regression
        run: bash scripts/test_manual_qso_lotw_queue.sh

  logger-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0005A universal logger regression
        run: bash scripts/test_universal_qso_logger.sh

  lotw-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0003B LoTW transaction regression
        run: bash scripts/test_lotw_transaction.sh

  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run inherited core regression
        run: bash scripts/test_core_regression.sh

  checkpoint:
    needs: [catalog, award-regression, queue-regression, logger-regression, lotw-regression, core-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0006b.py

      - name: Create immutable CP-0006B snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0006B-OFFICIAL_AWARD_CATALOG \
            --parent CP-0006A-AWARD_EVALUATION_ENGINE \
            --summary "Versioned officially sourced award catalog with conservative rule shapes, claim metadata, and sponsor-standing separation" \
            --phase "Official award catalog host-verified; award-target enrichment and composite rules next; hardware/account checkpoints remain deferred by owner" \
            --test-status "GREEN host/CI: catalog=115 award=67 queue=47 logger=78 LoTW_transaction=53 core=42062; finalizer run $FINALIZE_RUN_ID" \
            --completed "Versioned official award source ledger records HTTPS source URLs, retrieval dates and source versions where available" \
            --completed "Initial verified catalog includes DXCC Mixed, WAS, WAC, Triple Play WAS, IOTA 100, POTA Bronze Hunter and SOTA Shack Sloth" \
            --completed "Simple distinct-target catalog entries can create CP-0006A local threshold definitions without sponsor claimability" \
            --completed "Triple Play remains a state-by-mode matrix and IOTA 100 remains count-plus-seven-continent coverage rather than unsafe flattened counts" \
            --completed "POTA automatic issuance and SOTA external point scoring are represented explicitly" \
            --completed "Official AWARDED/CREDITED standing is separate from local progress and requires explicit sponsor evidence" \
            --completed "Focused official-catalog gate PASS 115; award evaluator PASS 67; queue PASS 47; logger PASS 78; LoTW transaction PASS 53; core PASS 42062" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return to CP-0003C until the owner explicitly says 'resume CP-0003C'" \
            --blocker "Skip any checkpoint requiring the phone, radio, real credentials/certificates, real accounts, RF testing, or other manual hardware validation; continue to the next GitHub/CI-only checkpoint" \
            --blocker "CP-0004A/B/C FTX-1 Android hardware checkpoints remain deferred and incomplete" \
            --blocker "Current QSO records do not contain normalized remote DXCC/state/continent/IOTA/POTA award targets; CP-0006B does not guess them" \
            --blocker "Triple Play and IOTA need composite evaluation; SOTA remains external program scoring" \
            --blocker "VUCC and CQ WAZ/WPX remain catalog-expansion work until their full verified rule/source shape is encoded" \
            --next "CP-0006C: add provenance-bearing normalized award-target evidence keyed by immutable QSO id and official date/band/confirmation filters" \
            --next "Implement Triple Play state-by-mode and IOTA count-plus-continent composite evaluation without rewriting authoritative QSO records" \
            --next "Do not attempt real sponsor-account login or claim submission; continue skipping phone/radio/credential/account/RF/manual-hardware checkpoints"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0006B-OFFICIAL_AWARD_CATALOG.json
          git add -f checkpoints/snapshots/CP-0006B-OFFICIAL_AWARD_CATALOG.tar.gz
          git commit -m "Checkpoint CP-0006B official award catalog"
          git push
