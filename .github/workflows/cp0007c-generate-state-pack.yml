name: CP-0007C Generate Census State Pack

on:
  push:
    branches:
      - cp-0007c-us-state-geometry-pack
    paths:
      - 'scripts/build_us_state_geometry_pack.py'
      - '.github/workflows/cp0007c-generate-state-pack.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build deterministic production state pack
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_us_state_geometry_pack.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/maps/US_STATE_2025_20M_PACK.json")
          data = json.loads(p.read_text())
          assert data["featureCount"] == 50, data["featureCount"]
          assert len(data["stateIdentities"]) == 50
          assert "DC" not in data["stateIdentities"]
          assert "PR" not in data["stateIdentities"]
          assert data["alaska"]["maxRingSegmentLongitudeJump"] <= 180.0
          assert data["canonicalPackSha256"]
          assert data["upstream"]["sha256"]
          print("generated pack metadata validation: PASS")
          PY
          git diff --check

      - name: Commit generated production pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-geometry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add core/src/main/kotlin/dev/n0png/fieldops/core/map/Census2025UsState20mGeometryPack.kt
          git add research/maps/US_STATE_2025_20M_PACK.json
          if git diff --cached --quiet; then
            echo "Production pack already deterministic and current."
            exit 0
          fi
          git commit -m "CP-0007C generate Census 2025 state geometry pack"
          git push
