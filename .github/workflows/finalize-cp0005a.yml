name: Verify CP-0005A checkpoint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable CP-0005A snapshot
        run: python3 scripts/verify_checkpoint.py --root . --id CP-0005A-UNIVERSAL_QSO_LOGGER
