name: CP-0006G Extended Award Catalog

on:
  push:
    branches:
      - cp-0006g-extended-award-catalog
  pull_request:
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/awards/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/ExtendedAwardCatalogTests.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/OfficialAwardCatalogTests.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/AwardEvidencePersistenceTests.kt'
      - 'research/awards/OFFICIAL_AWARD_SOURCES.tsv'
      - 'scripts/test_extended_award_catalog.sh'
      - 'scripts/test_awards_center_application_service.sh'
      - 'scripts/test_award_evidence_persistence.sh'
      - 'scripts/test_awards_center_projection.sh'
      - 'scripts/test_award_target_enrichment.sh'
      - 'scripts/test_official_award_catalog.sh'
      - 'scripts/test_award_evaluation.sh'
      - 'scripts/test_manual_qso_lotw_queue.sh'
      - 'scripts/test_universal_qso_logger.sh'
      - 'scripts/test_lotw_transaction.sh'
      - 'scripts/test_core_regression.sh'
      - 'scripts/finalize_cp0006g.py'
      - 'research/awards/CP-0006G_EXTENDED_AWARD_CATALOG.md'
      - '.github/workflows/cp0006g-extended-award-catalog.yml'
      - '.github/workflows/finalize-cp0006g.yml'

permissions:
  contents: read

jobs:
  extended-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run focused CP-0006G extended catalog gate
        run: bash scripts/test_extended_award_catalog.sh

      - name: Dry-run CP-0006G checkpoint handoff generator
        shell: bash
        env:
          FINALIZE_RUN_ID: premerge-dry-run
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/finalize_cp0006g.py
          python3 scripts/finalize_cp0006g.py
          grep -Fq 'CP-0006G-EXTENDED_AWARD_CATALOG' README.md
          grep -Fq 'CP-0007A — Award-area map projection foundation' NEXT_ACTION.md
          grep -Fq 'CP-0007A-AWARD_MAP_PROJECTION' SOFTWARE_TRACK.md
          grep -Fq 'CP-0006G — Extended official award catalog and evaluator coverage' checkpoints/CHECKPOINT_HISTORY.md
          grep -Fq 'CP-0003C is **DEFERRED**' NEXT_ACTION.md
          grep -Fq 'Create immutable CP-0006G snapshot' .github/workflows/finalize-cp0006g.yml
          git diff --check

  service-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_awards_center_application_service.sh

  persistence-regression:
