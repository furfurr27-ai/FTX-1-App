name: Finalize CP-0008I checkpoint

# CP-0008I is immutable and superseded. Manual-only prevents later propagation
# checkpoints from re-finalizing this historical checkpoint.
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  concrete-https:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_concrete_public_https_transport.sh

  inherited:
    name: inherited — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: public-transport, script: scripts/test_public_propagation_transport_adapters.sh}
          - {label: refresh, script: scripts/test_propagation_refresh_coordinator.sh}
          - {label: projection, script: scripts/test_propagation_projection.sh}
          - {label: aggregation, script: scripts/test_propagation_aggregation_offline_cache.sh}
          - {label: psk-reporter, script: scripts/test_psk_reporter_heard_path_adapter.sh}
          - {label: glotec, script: scripts/test_glotec_ionospheric_adapter.sh}
          - {label: noaa-swpc, script: scripts/test_noaa_swpc_propagation_adapter.sh}
          - {label: propagation, script: scripts/test_propagation_foundation.sh}
          - {label: production-pack, script: scripts/test_production_us_state_geometry_pack.sh}
          - {label: geometry, script: scripts/test_award_geometry_providers.sh}
          - {label: map, script: scripts/test_award_area_map_projection.sh}
          - {label: extended, script: scripts/test_extended_award_catalog.sh}
          - {label: service, script: scripts/test_awards_center_application_service.sh}
          - {label: persistence, script: scripts/test_award_evidence_persistence.sh}
          - {label: awards-projection, script: scripts/test_awards_center_projection.sh}
          - {label: target, script: scripts/test_award_target_enrichment.sh}
          - {label: catalog, script: scripts/test_official_award_catalog.sh}
          - {label: award, script: scripts/test_award_evaluation.sh}
          - {label: queue, script: scripts/test_manual_qso_lotw_queue.sh}
          - {label: logger, script: scripts/test_universal_qso_logger.sh}
          - {label: lotw, script: scripts/test_lotw_transaction.sh}
          - {label: core, script: scripts/test_core_regression.sh}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash "${{ matrix.script }}"

  checkpoint:
    needs: [concrete-https, inherited]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Update durable handoff
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0008i.py
      - name: Create and verify immutable checkpoint
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0008I-CONCRETE_PUBLIC_HTTPS_TRANSPORT \
            --parent CP-0008H-PUBLIC_PROPAGATION_TRANSPORT_ADAPTERS \
            --summary "Concrete JVM/Android-compatible bounded HttpsURLConnection transport with strict UTF-8, redirect refusal, timeout/retry semantics, deterministic cleanup and source-adapter integration" \
            --phase "Concrete public HTTPS transport host-verified; propagation runtime composition next; hardware/account checkpoints remain deferred by owner" \
            --test-status "GREEN host/CI: concrete_https=70 public_transport=98 refresh=112 projection=79 aggregation=101 pskr=168 glotec=87 noaa=53 propagation=154 production_pack=363 geometry=102 map=96 extended=96 service=64 persistence=92 awards_projection=114 target=77 catalog=115 award=67 queue=47 logger=78 LoTW_transaction=53 core=42062; finalizer run $FINALIZE_RUN_ID" \
            --completed "HttpsUrlConnectionPublicPropagationTransport provides a concrete JVM/Android-compatible GET implementation behind PublicPropagationTransport" \
            --completed "HTTPS parsing rejects missing host, URL user-info credentials and fragments before connection creation" \
            --completed "GET, redirect refusal, bounded connect/read timeouts, cache/input/output settings and deterministic Accept/UTF-8/identity/User-Agent headers are configured" \
            --completed "Declared and streamed response byte limits enforce request.maxResponseBytes without unbounded buffering" \
            --completed "Non-identity Content-Encoding and malformed/unmappable UTF-8 fail closed as non-retryable contract failures" \
            --completed "HTTP error streams preserve status/body; timeout/I/O/open failures are retryable while contract failures remain non-retryable" \
            --completed "PublicPropagationSourceAdapters preserves explicit PublicPropagationTransportException retryability" \
            --completed "Streams close and every opened connection disconnects across success and failure paths" \
            --completed "Concrete transport integration feeds the verified NOAA F10.7 parser without parser-policy changes" \
            --completed "Required CI has no external-provider dependency and production CP-0008I code has no Android framework/WorkManager/Compose/OkHttp/Retrofit, credentials/accounts, FTX-1/PTT/RF, QSO/logbook-write or LoTW behavior" \
            --completed "Superseded CP-0008H finalizer is manual-only" \
            --completed "Focused concrete HTTPS PASS 70; public transport PASS 98; refresh PASS 112; projection PASS 79; aggregation PASS 101; PSK Reporter PASS 168; GloTEC PASS 87; NOAA PASS 53; propagation PASS 154; production state pack PASS 363; geometry PASS 102; map PASS 96; extended PASS 96; service PASS 64; persistence PASS 92; awards projection PASS 114; target PASS 77; catalog PASS 115; award PASS 67; queue PASS 47; logger PASS 78; LoTW transaction PASS 53; core PASS 42062" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return until owner explicitly says 'resume CP-0003C'" \
            --blocker "CP-0004A/B/C hardware checkpoints remain incomplete" \
            --blocker "Android app lifecycle/network permission/background scheduling, live provider uptime, WSPRnet/WSPR.live, GIRO and HFcast/VOACAP remain unproven" \
            --next "CP-0008J: compose concrete HTTPS transport, all five public sources, refresh/cache state and workspace projection into one platform-neutral runtime" \
            --next "Make callsign/query and cadence configuration explicit with safe provider-minimum defaults and deterministic injected transport/storage CI" \
            --next "Keep WorkManager/background scheduling, Android lifecycle/network permission, credentials/accounts and new providers outside CP-0008J"
          python3 scripts/verify_checkpoint.py --root . --latest
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0008I-CONCRETE_PUBLIC_HTTPS_TRANSPORT.json
          git add -f checkpoints/snapshots/CP-0008I-CONCRETE_PUBLIC_HTTPS_TRANSPORT.tar.gz
          git commit -m "Checkpoint CP-0008I concrete public HTTPS transport"
          git push
