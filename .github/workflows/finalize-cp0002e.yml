name: Finalize CP-0002E checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/**'
      - 'core/src/test/kotlin/**'
      - 'android/compat/src/main/java/**'
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/dsp/**'
      - 'android/pipeline/src/test/**'
      - 'native/wspr/**'
      - 'scripts/test_core_regression.sh'
      - 'scripts/test_ft_family_mode.sh'
      - 'scripts/test_aprs_regression.sh'
      - 'scripts/test_js8_native.sh'
      - 'scripts/test_wspr_tx.sh'
      - 'scripts/test_native_mode_composition.sh'
      - 'scripts/finalize_cp0002e.py'
      - 'research/CP-0002E_NATIVE_MODE_REGRESSION.md'
      - '.github/workflows/finalize-cp0002e.yml'

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run inherited core regression on merged main
        run: bash scripts/test_core_regression.sh

  ft8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run FT8 regression on merged main
        run: bash scripts/test_ft_family_mode.sh FT8

  ft4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run FT4 regression on merged main
        run: bash scripts/test_ft_family_mode.sh FT4

  ft2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run FT2 regression on merged main
        run: bash scripts/test_ft_family_mode.sh FT2

  aprs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run APRS regression on merged main
        run: bash scripts/test_aprs_regression.sh

  js8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run JS8 RX/TX regression on merged main
        run: bash scripts/test_js8_native.sh

  wspr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22 and FFTW3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Verify exact pinned WSPR blobs
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'	' read -r upstream expected vendored; do
            [[ "$upstream" == "UpstreamPath" ]] && continue
            actual="$(git hash-object "$vendored")"
            [[ "$actual" == "$expected" ]] || {
              echo "vendored blob mismatch: $vendored expected=$expected actual=$actual" >&2
              exit 1
            }
          done < native/wspr/UPSTREAM_BLOBS.tsv
      - name: Re-run WSPR RX/TX regression on merged main
        run: bash scripts/test_wspr_tx.sh

  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run shared composition regression on merged main
        run: bash scripts/test_native_mode_composition.sh

  checkpoint:
    needs: [core, ft8, ft4, ft2, aprs, js8, wspr, composition]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0002e.py

      - name: Create immutable CP-0002E snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py             --root .             --id CP-0002E-NATIVE_MODE_REGRESSION             --parent CP-0002D-WSPR_NATIVE_TX             --summary "Independent FT8/FT4/FT2, JS8, WSPR and APRS host regressions plus shared audio/timing/TX-ownership composition"             --phase "Native-mode foundation regression-locked; TrustedQSL signer bridge next"             --test-status "GREEN host/CI: core=42062 pipeline=56 LoTW=19 FT8=20 FT4=20 FT2=20 JS8_RX=19 JS8_TX=39 WSPR_RX=21 WSPR_TX=56 APRS=2048 composition=130; Android/device/RF proof not run; finalizer run $FINALIZE_RUN_ID"             --source-pin "patrickrb/FT8AF@c2f63e8b37fcd484fd2eb2049494425dd2414971"             --source-pin "JS8Call-improved/Android-port@9996202f355569c5ee7b97fae539f3b763081dc2"             --source-pin "Guenael/rtlsdr-wsprd@1ca9b83dd2562ce9ef2453aacdd5bc3aab982c7d"             --completed "Independent FT8 host adapter regression PASS 20 assertions"             --completed "Independent FT4 host adapter regression PASS 20 assertions"             --completed "Independent FT2 host adapter regression PASS 20 assertions"             --completed "Independent JS8 RX PASS 19 and TX PASS 39 assertions"             --completed "Independent WSPR RX PASS 21 and TX PASS 56 assertions with exact pinned WSPR blobs verified"             --completed "Independent APRS AX.25/KISS/Bell-202/SmartBeaconing regression PASS 2048 assertions"             --completed "Shared 48 kHz/12 kHz, continuous/windowed timing and all-mode TX-ownership composition PASS 130 assertions"             --completed "Inherited core PASS 42062, pipeline PASS 56 and LoTW PASS 19"             --blocker "Public Git tree omits the extracted ARM64 libft8af.so, so CP-0002E does not execute actual FT8AF native DSP on x86_64 CI"             --blocker "Actual Samsung Galaxy S23 Ultra plus Yaesu FTX-1 CAT/USB audio runtime has not been tested"             --blocker "Actual FT-family and JS8 native execution on the phone, Android arm64 WSPR/FFTW3 packaging and real APRS off-air reception remain untested"             --blocker "Actual RF TX level, ALC, spectral purity and watchdog behavior remain untested"             --next "CP-0003A: pin official TrustedQSL source/version and build a narrow JNI signer bridge"             --next "Support PKCS#12 certificate import, explicit station-location selection and ADIF to signed GABBI/TQ8 output; fail closed if signer material or location is unavailable"             --next "Keep signing separate from upload/reconciliation; CP-0003B will own transaction-safe sign-upload-verify-commit behavior"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0002E-NATIVE_MODE_REGRESSION.json
          git add -f checkpoints/snapshots/CP-0002E-NATIVE_MODE_REGRESSION.tar.gz
          git commit -m "Checkpoint CP-0002E native mode regression"
          git push
