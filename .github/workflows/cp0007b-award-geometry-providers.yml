name: CP-0007B Award Geometry Providers

on:
  push:
    branches:
      - cp-0007b-award-geometry-providers
  pull_request:
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/map/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/AwardGeometryProviderTests.kt'
      - 'research/maps/GEOMETRY_SOURCES.tsv'
      - 'scripts/test_award_geometry_providers.sh'
      - 'scripts/test_award_area_map_projection.sh'
      - 'scripts/test_extended_award_catalog.sh'
      - 'scripts/test_awards_center_application_service.sh'
      - 'scripts/test_award_evidence_persistence.sh'
      - 'scripts/test_awards_center_projection.sh'
      - 'scripts/test_award_target_enrichment.sh'
      - 'scripts/test_official_award_catalog.sh'
      - 'scripts/test_award_evaluation.sh'
      - 'scripts/test_manual_qso_lotw_queue.sh'
      - 'scripts/test_universal_qso_logger.sh'
      - 'scripts/test_lotw_transaction.sh'
      - 'scripts/test_core_regression.sh'
      - 'scripts/finalize_cp0007b.py'
      - 'research/maps/CP-0007B_AWARD_GEOMETRY_PROVIDERS.md'
      - '.github/workflows/cp0007b-award-geometry-providers.yml'
      - '.github/workflows/finalize-cp0007b.yml'

permissions:
  contents: read

jobs:
  geometry-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_award_geometry_providers.sh

      - name: Dry-run CP-0007B checkpoint handoff generator
        shell: bash
        env:
          FINALIZE_RUN_ID: premerge-dry-run
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/finalize_cp0007b.py
          python3 scripts/finalize_cp0007b.py
          grep -Fq 'CP-0007B-AWARD_GEOMETRY_PROVIDERS' README.md
          grep -Fq 'CP-0007C — Production U.S. state offline geometry pack' NEXT_ACTION.md
          grep -Fq 'CP-0007C-US_STATE_GEOMETRY_PACK' SOFTWARE_TRACK.md
          grep -Fq 'CP-0007B — Award geometry providers and offline geometry-pack contract' checkpoints/CHECKPOINT_HISTORY.md
          grep -Fq 'CP-0003C is **DEFERRED**' NEXT_ACTION.md
          grep -Fq 'Create immutable CP-0007B snapshot' .github/workflows/finalize-cp0007b.yml
          git diff --check

  map-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_award_area_map_projection.sh

