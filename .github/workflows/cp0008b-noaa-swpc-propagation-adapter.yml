name: CP-0008B NOAA SWPC Propagation Adapter

on:
  push:
    branches:
      - cp-0008b-noaa-swpc-propagation-adapter
  pull_request:
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/NoaaSwpcPropagationAdapterTests.kt'
      - 'research/propagation/**'
      - 'scripts/test_noaa_swpc_propagation_adapter.sh'
      - 'scripts/check_noaa_swpc_schema.py'
      - 'scripts/finalize_cp0008b.py'
      - '.github/workflows/cp0008b-noaa-swpc-propagation-adapter.yml'
      - '.github/workflows/finalize-cp0008b.yml'

permissions:
  contents: read

jobs:
  noaa-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Deterministic CP-0008B gate
        run: bash scripts/test_noaa_swpc_propagation_adapter.sh
      - name: Dry-run CP-0008B checkpoint handoff generator
        env:
          FINALIZE_RUN_ID: premerge-dry-run
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/finalize_cp0008b.py
          python3 scripts/finalize_cp0008b.py
          grep -Fq 'CP-0008B-NOAA_SWPC_PROPAGATION_ADAPTER' README.md
          grep -Fq 'CP-0008C — NOAA SWPC GloTEC public ionospheric map adapter' NEXT_ACTION.md
          grep -Fq 'CP-0008C-NOAA_SWPC_GLOTEC_IONOSPHERIC_ADAPTER' SOFTWARE_TRACK.md
          grep -Fq 'CP-0008B — NOAA SWPC public propagation source adapter' checkpoints/CHECKPOINT_HISTORY.md
          grep -Fq 'CP-0003C is **DEFERRED**' NEXT_ACTION.md
          grep -Fq 'Create immutable CP-0008B snapshot' .github/workflows/finalize-cp0008b.yml
          git diff --check

  live-noaa-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify current public NOAA schemas without asserting current values
        run: python3 scripts/check_noaa_swpc_schema.py

  inherited-regression:
    name: inherited — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: propagation
            script: scripts/test_propagation_foundation.sh
          - label: production-pack
            script: scripts/test_production_us_state_geometry_pack.sh
          - label: geometry
            script: scripts/test_award_geometry_providers.sh
          - label: map
            script: scripts/test_award_area_map_projection.sh
          - label: extended
            script: scripts/test_extended_award_catalog.sh
          - label: service
            script: scripts/test_awards_center_application_service.sh
          - label: persistence
            script: scripts/test_award_evidence_persistence.sh
          - label: projection
            script: scripts/test_awards_center_projection.sh
          - label: target
            script: scripts/test_award_target_enrichment.sh
          - label: catalog
            script: scripts/test_official_award_catalog.sh
          - label: award
            script: scripts/test_award_evaluation.sh
          - label: queue
            script: scripts/test_manual_qso_lotw_queue.sh
          - label: logger
            script: scripts/test_universal_qso_logger.sh
          - label: lotw
            script: scripts/test_lotw_transaction.sh
          - label: core
            script: scripts/test_core_regression.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run inherited gate
        run: bash "${{ matrix.script }}"
