name: Finalize CP-0007C checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/map/AwardGeometryProviders.kt'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/map/GeometryPackIntegrity.kt'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/map/Census2025UsState20mGeometryPack.kt'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/map/Census2025UsState20mPackMetadata.kt'
      - 'core/src/main/resources/dev/n0png/fieldops/maps/us_states_2025_20m.pack'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/ProductionUsStateGeometryPackTests.kt'
      - 'research/maps/GEOMETRY_SOURCES.tsv'
      - 'research/maps/US_STATE_2025_20M_PACK.json'
      - 'research/maps/CP-0007C_PRODUCTION_US_STATE_PACK.md'
      - 'scripts/build_us_state_geometry_pack.py'
      - 'scripts/test_production_us_state_geometry_pack.sh'
      - 'scripts/finalize_cp0007c.py'
      - '.github/workflows/finalize-cp0007c.yml'

permissions:
  contents: write

jobs:
  production-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_production_us_state_geometry_pack.sh

  geometry-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
