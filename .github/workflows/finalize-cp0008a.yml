name: Finalize CP-0008A checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/PropagationFoundationTests.kt'
      - 'research/propagation/**'
      - 'scripts/test_propagation_foundation.sh'
      - 'scripts/finalize_cp0008a.py'
      - '.github/workflows/finalize-cp0008a.yml'

permissions:
  contents: write

jobs:
  propagation-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_propagation_foundation.sh

  production-pack:
