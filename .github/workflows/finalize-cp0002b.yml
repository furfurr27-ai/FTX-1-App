name: Finalize CP-0002B checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/audio/StreamingLinearResampler.kt'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/radio/**'
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/dsp/Js8EngineAdapter.kt'
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/dsp/Js8CallAndroidEngineFactory.kt'
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/dsp/Js8TxController.kt'
      - 'android/pipeline/src/test/kotlin/dev/n0png/fieldops/android/dsp/Js8TxTests.kt'
      - 'android/pipeline/src/test/kotlin/com/js8call/core/JS8Engine.kt'
      - 'scripts/test_js8_native.sh'
      - 'research/js8/CP-0002B_JS8_TX_INTEGRATION.md'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kotlin compiler 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Re-run focused CP-0002B gate on merged main
        shell: bash
        run: bash scripts/test_js8_native.sh

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          root = pathlib.Path(".")
          run_id = os.environ["FINALIZE_RUN_ID"]
          (root / "VERSION").write_text("v8-js8-native-tx\n")

          readme = (root / "README.md").read_text()
          baseline = f"""## Verified durable baseline

**Latest verified checkpoint:** `CP-0002B-JS8_NATIVE_TX`

Parent: `CP-0002A-JS8_NATIVE_RX`.

CP-0002B is a **GREEN host/CI integration checkpoint with YELLOW hardware/RF status**. It adds the JS8 transmit boundary without claiming actual S23 Ultra / FTX-1 RF proof.

CP-0002B adds and proves:

- The pinned JS8 native TX audio tap is enabled while upstream rig/PTT ownership remains unused.
- `Js8TxController` queues native JS8 modulation with the native transmit gate closed.
- CAT PTT and USB TX audio are reachable only through the FieldOps-owned `Ftx1RadioSession` / `RadioModeArbiter` path.
- FieldOps pre-keys CAT PTT before opening the native transmit gate.
- Native TX PCM is statefully rate-adapted from its callback rate (11,520 Hz at the pinned upstream build) to the configured 48 kHz FTX-1 playback domain.
- Normal completion and failure/cancel/close paths attempt `TX0`, close TX audio and release radio ownership.
- Deterministic JS8 TX safety tests pass with **39 assertions**; JS8 RX remains green with **19 assertions**.
- The inherited core regression remains green: **42,062 core assertions, 56 pipeline assertions, 19 LoTW assertions**.
- The exact pinned ARM64 artifact was re-checked for required JS8 TX/lifecycle JNI exports.

Pinned upstream JS8 source:

`JS8Call-improved/Android-port@9996202f355569c5ee7b97fae539f3b763081dc2`

Exact upstream Android Build run checked: `36659533828`, conclusion **success**.

Exact checked artifact and TX-boundary evidence is recorded in `research/js8/CP-0002B_JS8_TX_INTEGRATION.md`.

- CP-0002B finalization workflow run: `{run_id}`

### Inherited verified ancestry

`CP-0002A-JS8_NATIVE_RX` remains the verified JS8 receive parent checkpoint. `CP-0001-GITHUB_SURVEY` remains its verified source/research ancestor.

### Hardware/RF boundary

Actual Galaxy S23 Ultra + FTX-1 USB enumeration/playback, real JS8 RF transmission, output-level/ALC calibration and RF spectral-quality validation are **not** proven by CP-0002B. Final Android AAR/APK packaging also remains a later task.

The older project-library `FTX1_FieldOps_CP-0002_JS8_NATIVE.zip` remains an inaccessible recovery/comparison lead and was not used as proof for this checkpoint.

"""
          readme = re.sub(
              r"## Verified durable baseline\n.*?\n## Engineering rules",
              baseline + "## Engineering rules",
              readme,
              flags=re.S,
          )

          readme = readme.replace(
              "- Current Git source baseline before this finalization run: `CP-0002A-JS8_NATIVE_RX`",
              "- Current Git source baseline: `CP-0002B-JS8_NATIVE_TX`",
          )

          next_section = """## Current exact next action

**CP-0002C — WSPR native RX only.**

1. Vendor the pinned pure-C WSPR decoder from `Guenael/rtlsdr-wsprd@1ca9b83dd2562ce9ef2453aacdd5bc3aab982c7d`.
2. Keep the shared 12 kHz FieldOps receive branch as the source.
3. Mix the WSPR passband to complex baseband, low-pass it and decimate to the decoder's 375 Hz complex-I/Q input.
4. Assemble the 120-second / 45,000-complex-sample WSPR decoder window without changing JS8 or FT-family timing.
5. Exit gate: pinned/native WSPR encoding fixture -> synthesized receive waveform -> FieldOps downconverter -> correct decoded message.
6. Do not implement WSPR TX in CP-0002C; that is CP-0002D.
7. Keep Android/radio hardware status YELLOW/RED until actual S23 Ultra + FTX-1 testing.

"""
          readme = re.sub(
              r"## Current exact next action\n.*?\n## README maintenance contract",
              next_section + "## README maintenance contract",
              readme,
              flags=re.S,
          )
          (root / "README.md").write_text(readme)

          (root / "NEXT_ACTION.md").write_text("""# NEXT ACTION — FTX-1 FieldOps

**CP-0002C — WSPR native RX only**

Vendor and integrate the pinned pure-C WSPR decoder from `Guenael/rtlsdr-wsprd@1ca9b83dd2562ce9ef2453aacdd5bc3aab982c7d`. Feed it from the existing 12 kHz receive branch through a complex-baseband mixer, low-pass filter and /32 decimation to 375 Hz. Prove the complete receive path with a pinned/native encoder fixture and synthesized WSPR waveform that decodes to the expected message.

Do **not** implement WSPR TX in this checkpoint.
""")

          history = root / "checkpoints" / "CHECKPOINT_HISTORY.md"
          history_text = history.read_text()
          entry = f"""## CP-0002B — JS8 native TX

Parent: `CP-0002A-JS8_NATIVE_RX`

FieldOps now captures the pinned JS8 native TX audio tap while retaining exclusive CAT/PTT/USB-audio ownership. Native modulation is gated until FieldOps acquires the JS8 radio owner and completes PTT lead, then callback PCM is statefully adapted to the 48 kHz playback domain. Normal completion and all tested error/cancel paths collapse to RX-safe state.

Host/CI gate: core 42,062; pipeline 56; LoTW 19; JS8 RX 19; JS8 TX 39 assertions, all PASS.

Finalization workflow run: `{run_id}`.

Evidence: `research/js8/CP-0002B_JS8_TX_INTEGRATION.md`.
"""
          if "## CP-0002B — JS8 native TX" not in history_text:
              history.write_text(history_text.rstrip() + "\n\n" + entry)
          PY

      - name: Create immutable CP-0002B snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0002B-JS8_NATIVE_TX \
            --parent CP-0002A-JS8_NATIVE_RX \
            --summary "JS8 native transmit audio routed exclusively through FieldOps TX ownership" \
            --phase "Native modes: JS8 RX/TX host-integrated; WSPR RX next" \
            --test-status "GREEN host/CI: core=42062 pipeline=56 LoTW=19 JS8_RX=19 JS8_TX=39; exact pinned ARM64 TX JNI exports checked; device/RF proof not run; finalizer run $FINALIZE_RUN_ID" \
            --source-pin "JS8Call-improved/Android-port@9996202f355569c5ee7b97fae539f3b763081dc2" \
            --completed "Pinned JS8 native TX audio tap enabled with upstream rig/PTT path unused" \
            --completed "JS8 native transmit gate remains closed until FieldOps owns radio and completes CAT PTT lead" \
            --completed "JS8 TX callback PCM routed only through Ftx1RadioSession streaming TX path" \
            --completed "Stateful callback-rate to 48 kHz streaming rate adapter implemented and chunk-invariance tested" \
            --completed "Normal JS8 completion attempts TX0, closes TX audio and releases ownership" \
            --completed "Audio failure, unexpected early native audio, cancel and close paths fail closed to RX-safe state" \
            --completed "Focused deterministic JS8 TX suite PASS 39 assertions; JS8 RX PASS 19; inherited core/pipeline/LoTW suites green" \
            --completed "Exact successful upstream ARM64 artifact re-checked for nativeTransmitMessage/stop/status/setTransmitReady exports" \
            --blocker "Actual Samsung Galaxy S23 Ultra + Yaesu FTX-1 JS8 RF TX has not been device-tested" \
            --blocker "Actual FTX-1 Android USB playback endpoint/rate/level remains unverified" \
            --blocker "RF spectral quality, ALC and transmit-power calibration remain unverified" \
            --blocker "Final Android AAR/APK packaging of the pinned JS8 native runtime remains unfinished" \
            --blocker "Project-library FTX1_FieldOps_CP-0002_JS8_NATIVE.zip remains inaccessible for raw-byte comparison" \
            --next "CP-0002C: vendor pinned Guenael/rtlsdr-wsprd pure-C decoder" \
            --next "Implement 12 kHz real to 375 Hz complex-IQ WSPR receive front end and 120-second decoder window" \
            --next "Prove native encoder fixture through synthesized RX waveform to expected WSPR decode; do not implement WSPR TX yet"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0002B-JS8_NATIVE_TX.json
          git add -f checkpoints/snapshots/CP-0002B-JS8_NATIVE_TX.tar.gz
          git commit -m "Checkpoint CP-0002B JS8 native TX"
          git push
