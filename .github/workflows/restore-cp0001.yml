name: Manual CP-0001 source recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RESTORE_CP0001 to overwrite matching files with the CP-0001 recovery source'
        required: true
        type: string

permissions:
  contents: write

jobs:
  restore:
    if: github.event.inputs.confirmation == 'RESTORE_CP0001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble verified text-source import
        shell: bash
        run: |
          set -euo pipefail
          cat recovery/cp0001-source.part* > /tmp/cp0001.b64
          base64 -d /tmp/cp0001.b64 > /tmp/cp0001-source.tar.gz
          echo "125026544bb75c8089b14f8fbbcdba131d755ad7599427bb7495acd717e3cbf2  /tmp/cp0001-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cp0001-source.tar.gz -C .
          rm -f /tmp/cp0001.b64 /tmp/cp0001-source.tar.gz

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Manually restore verified CP-0001 text source tree"
          git push
