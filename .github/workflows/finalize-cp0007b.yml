name: Finalize CP-0007B checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/map/AwardGeometryProviders.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/AwardGeometryProviderTests.kt'
      - 'research/maps/GEOMETRY_SOURCES.tsv'
      - 'research/maps/CP-0007B_AWARD_GEOMETRY_PROVIDERS.md'
      - 'scripts/test_award_geometry_providers.sh'
      - 'scripts/finalize_cp0007b.py'
      - '.github/workflows/finalize-cp0007b.yml'

permissions:
  contents: write

jobs:
  geometry-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_award_geometry_providers.sh

  map-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
