name: Finalize CP-0006F checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/awards/AwardsCenterApplicationService.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/AwardsCenterApplicationServiceTests.kt'
      - 'scripts/test_awards_center_application_service.sh'
      - 'scripts/finalize_cp0006f.py'
      - 'research/awards/CP-0006F_AWARDS_APPLICATION_SERVICE.md'
      - '.github/workflows/finalize-cp0006f.yml'

permissions:
  contents: write

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0006F application service gate
        run: bash scripts/test_awards_center_application_service.sh

  persistence-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0006E persistence/import regression
        run: bash scripts/test_award_evidence_persistence.sh

  projection-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0006D projection regression
        run: bash scripts/test_awards_center_projection.sh

  target-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0006C target/composite regression
        run: bash scripts/test_award_target_enrichment.sh

  catalog-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0006B catalog regression
        run: bash scripts/test_official_award_catalog.sh

  award-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0006A award regression
        run: bash scripts/test_award_evaluation.sh

  queue-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0005B queue regression
        run: bash scripts/test_manual_qso_lotw_queue.sh

  logger-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0005A logger regression
        run: bash scripts/test_universal_qso_logger.sh

  lotw-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0003B LoTW transaction regression
        run: bash scripts/test_lotw_transaction.sh

  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run inherited core regression
        run: bash scripts/test_core_regression.sh

  checkpoint:
    needs: [service, persistence-regression, projection-regression, target-regression, catalog-regression, award-regression, queue-regression, logger-regression, lotw-regression, core-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0006f.py

      - name: Create immutable CP-0006F snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0006F-AWARDS_APPLICATION_SERVICE \
            --parent CP-0006E-AWARD_EVIDENCE_PERSISTENCE \
            --summary "Platform-independent Awards Center application service composing authoritative logbook, persistent evidence, ADIF enrichment, and projection with immutable-QSO-id batch ingestion" \
            --phase "Awards Center application service host-verified; extended official award catalog next; hardware/account checkpoints remain deferred by owner" \
            --test-status "GREEN host/CI: service=64 persistence=92 projection=114 target=77 catalog=115 award=67 queue=47 logger=78 LoTW_transaction=53 core=42062; finalizer run $FINALIZE_RUN_ID" \
            --completed "Awards Center cards are generated from authoritative LogbookRepository state plus one current AwardEvidenceRepository snapshot" \
            --completed "Resolved ADIF ingestion requires existing immutable local QSO ids and never searches by callsign/date/grid/country/prefix/free text" \
            --completed "Explicit CALL is a fail-closed binding check only; unknown ids or mismatches reject the whole batch" \
            --completed "All source records convert before one combined evidence apply, preserving atomic batch semantics for malformed or conflicting evidence" \
            --completed "Batch ingestion is deterministic and idempotent; reversed input order produces the same canonical evidence state" \
            --completed "Parsed LoTW-style ADIF host fixtures feed confirmed award progress without network/account access" \
            --completed "Mixed/CW/Phone/Digital plus band/date queries flow through the service and sponsor standing remains explicit external evidence" \
            --completed "Focused service PASS 64; persistence PASS 92; projection PASS 114; target PASS 77; catalog PASS 115; award PASS 67; queue PASS 47; logger PASS 78; LoTW transaction PASS 53; core PASS 42062" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return to CP-0003C until the owner explicitly says 'resume CP-0003C'" \
            --blocker "Skip any checkpoint requiring the phone, radio, real credentials/certificates, real accounts, RF testing, or other manual hardware validation; continue to the next GitHub/CI-only checkpoint" \
            --blocker "CP-0004A/B/C FTX-1 Android hardware checkpoints remain deferred and incomplete" \
            --blocker "Automatic/fuzzy QSO matching, live LoTW download/login, sponsor account sync and claim submission remain outside CP-0006F" \
            --blocker "Android Room/SQLite storage, Compose UI and device persistence behavior remain unproven" \
            --next "CP-0006G: expand official award catalog/evaluator coverage using issuing-organization sources, prioritizing VUCC/grid awards, Fred Fish where representable, CQ WAZ/WPX, and useful regional/national programs" \
            --next "Add new normalized target kinds or evaluator shapes only where verified official rules require them; fail closed on sponsor-only or ambiguous requirements" \
            --next "Keep real sponsor accounts/claim submission out and continue skipping phone/radio/credential/account/RF/manual-hardware checkpoints"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0006F-AWARDS_APPLICATION_SERVICE.json
          git add -f checkpoints/snapshots/CP-0006F-AWARDS_APPLICATION_SERVICE.tar.gz
          git commit -m "Checkpoint CP-0006F Awards application service"
          git push
