name: Finalize CP-0003A checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/logbook/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/**'
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/logbook/**'
      - 'android/pipeline/src/test/kotlin/dev/n0png/fieldops/android/logbook/**'
      - 'native/tqsl/**'
      - 'scripts/test_tqsl_signer.sh'
      - 'scripts/test_core_regression.sh'
      - 'scripts/finalize_cp0003a.py'
      - 'research/tqsl/**'
      - 'research/LOTW_INTEGRATION.md'
      - '.github/workflows/finalize-cp0003a.yml'

permissions:
  contents: write

jobs:
  signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kotlin 1.9.22 and native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Re-run focused TrustedQSL signer gate on merged main
        shell: bash
        run: bash scripts/test_tqsl_signer.sh

  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Re-run inherited core/LoTW regression on merged main
        shell: bash
        run: bash scripts/test_core_regression.sh

  checkpoint:
    needs: [signer, core-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0003a.py

      - name: Create immutable CP-0003A snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py             --root .             --id CP-0003A-TRUSTEDQSL_SIGNER             --parent CP-0002E-NATIVE_MODE_REGRESSION             --summary "Official TrustedQSL 2.8.6 API-pinned transactional signer bridge for PKCS12, explicit station location and ADIF-to-TQ8"             --phase "TrustedQSL signer bridge host-verified; transaction-safe LoTW upload next"             --test-status "GREEN host/CI: signer=43 core=42062 pipeline=56 LoTW=19; official TrustedQSL 2.8.6 archive hash/API compile verified; Android ARM64 real certificate/server validation not run; finalizer run $FINALIZE_RUN_ID"             --source-pin "TrustedQSL-2.8.6@sha256:182e5f2ac35a3db8b409b45d96505e6bd265ae4668ed064754209c4b8e7bdf37"             --source-pin "TrustedQSL-master-api-review@78a143276e9bde53b2c9535839cc19ab45b686f0"             --completed "Official TrustedQSL 2.8.6 archive SHA256 verified before API compile"             --completed "Production JNI bridge compiles against exact official 2.8.6 tqsllib and tqslconvert headers"             --completed "In-memory PKCS12 import path uses official tqsllib Base64/import API and wipes transient copies"             --completed "Explicit station location callsign and DXCC must match the FieldOps station profile before signing"             --completed "Official certificate selection, signing-init, ADIF converter and GABBI API path represented by the production bridge"             --completed "Transactional LotwSigningSession preserves explicit TrustedQSL duplicate-state commit and rollback"             --completed "Closing an open signer session rolls back and signer/native failures fail closed"             --completed "Focused signer bridge PASS 43; inherited core PASS 42062, pipeline PASS 56 and LoTW PASS 19"             --blocker "Complete official TrustedQSL dependency stack has not been built/linked for Android arm64-v8a"             --blocker "Real Callsign Certificate PKCS12 import and cryptographic signing have not been tested on the Galaxy S23 Ultra"             --blocker "LoTW network upload/acceptance is intentionally not part of CP-0003A"             --blocker "Automatic LoTW upload remains disabled pending CP-0003C real device/test-account validation"             --next "CP-0003B: migrate upload to sign -> upload -> verify acceptance -> commit TrustedQSL duplicate state"             --next "Roll back the signer transaction on signing, network, rejection or acceptance-verification failure"             --next "Keep manual SSB/CW and digital QSOs on the same queue and do not equate HTTP success with LoTW acceptance"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0003A-TRUSTEDQSL_SIGNER.json
          git add -f checkpoints/snapshots/CP-0003A-TRUSTEDQSL_SIGNER.tar.gz
          git commit -m "Checkpoint CP-0003A TrustedQSL signer bridge"
          git push
