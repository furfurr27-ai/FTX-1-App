name: CP-0003C Secret Hygiene

on:
  workflow_dispatch:
  push:
    branches:
      - cp-0003c-real-lotw-validation
    paths:
      - 'android/validation-app/**'
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/logbook/**'
      - 'native/tqsl/**'
      - 'scripts/check_cp0003c_secret_hygiene.sh'
      - '.github/workflows/cp0003c-secret-hygiene.yml'
  pull_request:
    paths:
      - 'android/validation-app/**'
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/logbook/**'
      - 'native/tqsl/**'
      - 'scripts/check_cp0003c_secret_hygiene.sh'
      - '.github/workflows/cp0003c-secret-hygiene.yml'

permissions:
  contents: read

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run CP-0003C secret-hygiene gate
        shell: bash
        run: bash scripts/check_cp0003c_secret_hygiene.sh
