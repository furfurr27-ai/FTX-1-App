name: Finalize CP-0008C checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/PropagationDomain.kt'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/NoaaSwpcGlotecAdapter.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/NoaaSwpcGlotecAdapterTests.kt'
      - 'research/propagation/CP-0008C_GLOTEC_IONOSPHERIC_ADAPTER.md'
      - 'research/propagation/NOAA_SWPC_GLOTEC_FIXTURE.json'
      - 'research/propagation/fixtures/noaa_swpc_glotec_*'
      - 'research/propagation/PROPAGATION_SOURCES.tsv'
      - 'scripts/test_glotec_ionospheric_adapter.sh'
      - 'scripts/finalize_cp0008c.py'
      - '.github/workflows/finalize-cp0008b.yml'
      - '.github/workflows/finalize-cp0008c.yml'

permissions:
  contents: write

jobs:
  glotec-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_glotec_ionospheric_adapter.sh

  inherited-regression:
    name: inherited — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: noaa-swpc
            script: scripts/test_noaa_swpc_propagation_adapter.sh
          - label: propagation
            script: scripts/test_propagation_foundation.sh
          - label: production-pack
            script: scripts/test_production_us_state_geometry_pack.sh
          - label: geometry
            script: scripts/test_award_geometry_providers.sh
          - label: map
            script: scripts/test_award_area_map_projection.sh
          - label: extended
            script: scripts/test_extended_award_catalog.sh
          - label: service
            script: scripts/test_awards_center_application_service.sh
          - label: persistence
            script: scripts/test_award_evidence_persistence.sh
          - label: projection
            script: scripts/test_awards_center_projection.sh
          - label: target
            script: scripts/test_award_target_enrichment.sh
          - label: catalog
            script: scripts/test_official_award_catalog.sh
          - label: award
            script: scripts/test_award_evaluation.sh
          - label: queue
            script: scripts/test_manual_qso_lotw_queue.sh
          - label: logger
            script: scripts/test_universal_qso_logger.sh
          - label: lotw
            script: scripts/test_lotw_transaction.sh
          - label: core
            script: scripts/test_core_regression.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run inherited gate
        run: bash "${{ matrix.script }}"

  checkpoint:
    needs: [glotec-adapter, inherited-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0008c.py

      - name: Create immutable CP-0008C snapshot
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0008C-NOAA_SWPC_GLOTEC_IONOSPHERIC_ADAPTER \
            --parent CP-0008B-NOAA_SWPC_PROPAGATION_ADAPTER \
            --summary "Pinned NOAA SWPC GloTEC VTEC/TECU GeoJSON normalization with explicit provider coordinates/time/quality metadata, deterministic bounded fixture, fail-closed schema handling, and no direct TEC-to-path conversion" \
            --phase "NOAA SWPC GloTEC ionospheric map adapter host-verified; PSK Reporter public heard-path adapter next; hardware/account checkpoints remain deferred by owner" \
            --test-status "GREEN host/CI: glotec=87 noaa=53 propagation=154 production_pack=363 geometry=102 map=96 extended=96 service=64 persistence=92 projection=114 target=77 catalog=115 award=67 queue=47 logger=78 LoTW_transaction=53 core=42062; finalizer run $FINALIZE_RUN_ID" \
            --completed "Official NOAA/NWS GloTEC product semantics, ten-minute GeoJSON cadence, 2.5-degree by 5-degree global grid, TEC units, versioned artifact directory, and quality-flag semantics are source-pinned" \
            --completed "Provider-neutral ionospheric metrics now include VTEC_TECU without reinterpreting TEC as foF2, MUF, or hmF2" \
            --completed "IonosphericSample retains optional paired provider quality code/explanation metadata; GloTEC quality_flag 0..5 survives normalization" \
            --completed "Bounded four-cell 2026-09-09T15:15:00Z fixture is 1573 bytes with SHA-256 a98741d9a9586082db0eb357f3baf35be09a2646c8ab5b1b4203d4852b09bac2" \
            --completed "GeoJSON longitude/latitude coordinates remain explicit PROVIDER_COORDINATE geography with no callsign inference" \
            --completed "Canonical artifact filename time must match provider time_tag while retrieval UTC remains separate; no undocumented generation timestamp is fabricated" \
            --completed "GloTEC-only context remains UNKNOWN for path usability with explicit ionospheric-context and insufficient-path reasons" \
            --completed "Schema, source URL, time, coordinate, numeric, quality, duplicate-key, and duplicate-coordinate drift fail closed" \
            --completed "Core GloTEC parser has no network transport, Android/map SDK, QSO/LoTW, FTX-1/PTT, or direct TEC-to-MUF/path-score dependency" \
            --completed "Superseded CP-0008B finalizer is manual-only to prevent checkpoint-state regression" \
            --completed "Focused GloTEC PASS 87; NOAA adapter PASS 53; propagation PASS 154; production state pack PASS 363; geometry provider PASS 102; map PASS 96; extended catalog PASS 96; service PASS 64; persistence PASS 92; projection PASS 114; target PASS 77; catalog PASS 115; award PASS 67; queue PASS 47; logger PASS 78; LoTW transaction PASS 53; core PASS 42062" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return to CP-0003C until the owner explicitly says 'resume CP-0003C'" \
            --blocker "Skip any checkpoint requiring the phone, radio, real credentials/certificates, real accounts, RF testing, or other manual hardware validation; continue to the next GitHub/CI-only checkpoint" \
            --blocker "CP-0004A/B/C FTX-1 Android hardware checkpoints remain deferred and incomplete" \
            --blocker "NOAA endpoint uptime/current global GloTEC state is external; deterministic fixture proves the pinned schema/normalization only" \
            --blocker "TEC is ionospheric context and no TEC-to-MUF or direct HF path-usability model is proven by CP-0008C" \
            --blocker "GIRO/PSK Reporter/WSPRnet/HFcast/VOACAP and Android network/map integrations remain unproven" \
            --next "CP-0008D: pin the official no-credential PSK Reporter retrieval/query schema and a deterministic representative XML response fixture" \
            --next "Normalize only reports with explicit valid transmitter and receiver Maidenhead locators into HeardPathObservation; preserve exact provider frequency/time/mode/SNR/provenance and never infer geography from callsigns" \
            --next "Keep reception reports separate from QSO/logbook/LoTW, respect published retrieval-rate guidance, and keep live polling out of deterministic CI"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0008C-NOAA_SWPC_GLOTEC_IONOSPHERIC_ADAPTER.json
          git add -f checkpoints/snapshots/CP-0008C-NOAA_SWPC_GLOTEC_IONOSPHERIC_ADAPTER.tar.gz
          git commit -m "Checkpoint CP-0008C NOAA SWPC GloTEC ionospheric adapter"
          git push
