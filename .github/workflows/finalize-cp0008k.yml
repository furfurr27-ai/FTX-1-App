name: Finalize CP-0008K checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/FilePropagationRefreshStateStore.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/PropagationRefreshStatePersistenceTests.kt'
      - 'research/propagation/CP-0008K_REFRESH_STATE_PERSISTENCE.md'
      - 'scripts/test_propagation_refresh_state_persistence.sh'
      - 'scripts/finalize_cp0008k.py'
      - '.github/workflows/cp0008k-propagation-refresh-state-persistence.yml'
      - '.github/workflows/finalize-cp0008k.yml'
      - '.github/workflows/finalize-cp0008j.yml'

permissions:
  contents: write

env:
  JAVA_OPTS: "-Xmx1536m -Xms128m"

jobs:
  refresh-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_propagation_refresh_state_persistence.sh

  inherited:
    name: inherited — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: runtime, script: scripts/test_propagation_runtime_composition.sh}
          - {label: concrete-https, script: scripts/test_concrete_public_https_transport.sh}
          - {label: public-transport, script: scripts/test_public_propagation_transport_adapters.sh}
          - {label: refresh, script: scripts/test_propagation_refresh_coordinator.sh}
          - {label: projection, script: scripts/test_propagation_projection.sh}
          - {label: aggregation, script: scripts/test_propagation_aggregation_offline_cache.sh}
          - {label: psk-reporter, script: scripts/test_psk_reporter_heard_path_adapter.sh}
          - {label: glotec, script: scripts/test_glotec_ionospheric_adapter.sh}
          - {label: noaa-swpc, script: scripts/test_noaa_swpc_propagation_adapter.sh}
          - {label: propagation, script: scripts/test_propagation_foundation.sh}
          - {label: production-pack, script: scripts/test_production_us_state_geometry_pack.sh}
          - {label: geometry, script: scripts/test_award_geometry_providers.sh}
          - {label: map, script: scripts/test_award_area_map_projection.sh}
          - {label: extended, script: scripts/test_extended_award_catalog.sh}
          - {label: service, script: scripts/test_awards_center_application_service.sh}
          - {label: persistence, script: scripts/test_award_evidence_persistence.sh}
          - {label: awards-projection, script: scripts/test_awards_center_projection.sh}
          - {label: target, script: scripts/test_award_target_enrichment.sh}
          - {label: catalog, script: scripts/test_official_award_catalog.sh}
          - {label: award, script: scripts/test_award_evaluation.sh}
          - {label: queue, script: scripts/test_manual_qso_lotw_queue.sh}
          - {label: logger, script: scripts/test_universal_qso_logger.sh}
          - {label: lotw, script: scripts/test_lotw_transaction.sh}
          - {label: core, script: scripts/test_core_regression.sh}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash "${{ matrix.script }}"

  checkpoint:
    needs: [refresh-state, inherited]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Update durable handoff
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0008k.py
      - name: Create and verify immutable checkpoint
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0008K-PROPAGATION_REFRESH_STATE_PERSISTENCE \
            --parent CP-0008J-PROPAGATION_RUNTIME_COMPOSITION \
            --summary "Versioned atomic file-backed propagation refresh-state persistence across runtime recreation" \
            --phase "Refresh-state persistence host-verified; source-status presentation next; hardware/account checkpoints deferred" \
            --test-status "GREEN host/CI: state_persistence=PASS runtime=67 concrete_https=70 public_transport=98 refresh=112 projection=79 aggregation=101 pskr=168 glotec=87 noaa=53 propagation=154 production_pack=363 geometry=102 map=96 extended=96 service=64 persistence=92 awards_projection=114 target=77 catalog=115 award=67 queue=47 logger=78 LoTW_transaction=53 core=42062; finalizer run $FINALIZE_RUN_ID" \
            --completed "Atomic file-backed refresh-state store with explicit PropagationRuntimeFactory injection and unchanged in-memory default" \
            --completed "Versioned deterministic strict binary codec with role/source and duplicate validation" \
            --completed "All source role, UTC attempt/success, consecutive failure, next eligible, message and retryability state survive recreation" \
            --completed "Corrupt/truncated/unknown-version/duplicate/mismatched persisted input fails closed" \
            --completed "Failed write leaves last valid file bytes and live state unchanged; no non-atomic fallback" \
            --completed "Deterministic offline fake transport proves 4/5/10 minute cadence and failure/backoff survive restart" \
            --completed "CP-0008J finalizer changed to manual-only" \
            --completed "All inherited host/CI regression gates green" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return until owner explicitly says 'resume CP-0003C'" \
            --blocker "CP-0004A/B/C hardware checkpoints remain incomplete" \
            --blocker "No Android lifecycle/WorkManager, power-loss fsync durability, multiprocess locking or phone/radio/RF validation" \
            --next "CP-0008L: add read-only platform-neutral propagation source-status presentation model using existing persisted refresh state" \
            --next "Preserve cadence, parser, snapshot/evidence and projection semantics; require deterministic CI" \
            --next "Keep all hardware/account and Android background work outside; CP-0003C remains DEFERRED"
          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit checkpoint
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0008K-PROPAGATION_REFRESH_STATE_PERSISTENCE.json
          git add -f checkpoints/snapshots/CP-0008K-PROPAGATION_REFRESH_STATE_PERSISTENCE.tar.gz
          git commit -m "Checkpoint CP-0008K propagation refresh-state persistence"
          git push
