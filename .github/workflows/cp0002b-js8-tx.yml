name: CP-0002B JS8 TX

on:
  push:
    branches:
      - cp-0002b-js8-tx
  pull_request:
    paths:
      - 'core/src/main/kotlin/**'
      - 'core/src/test/kotlin/**'
      - 'android/compat/src/main/java/**'
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/dsp/**'
      - 'android/pipeline/src/test/kotlin/**'
      - 'scripts/test_js8_native.sh'
      - 'research/js8/CP-0002B_JS8_TX_INTEGRATION.md'
      - '.github/workflows/cp0002b-js8-tx.yml'

permissions:
  contents: read

jobs:
  host-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kotlin compiler 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Run focused CP-0002B gate
        shell: bash
        run: bash scripts/test_js8_native.sh

      - name: Dry-run checkpoint handoff generator
        shell: bash
        env:
          FINALIZE_RUN_ID: premerge-dry-run
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/finalize_cp0002b.py
          python3 scripts/finalize_cp0002b.py
          grep -Fq 'CP-0002B-JS8_NATIVE_TX' README.md
          grep -Fq 'CP-0002C — WSPR native RX only' NEXT_ACTION.md
          grep -Fq 'CP-0002B — JS8 native TX' checkpoints/CHECKPOINT_HISTORY.md
          git diff --check

      - name: Verify exact pinned TX evidence identifiers
        shell: bash
        run: |
          set -euo pipefail
          E=research/js8/CP-0002B_JS8_TX_INTEGRATION.md
          grep -Fq '9996202f355569c5ee7b97fae539f3b763081dc2' "$E"
          grep -Fq 'ee23c95a6d0b5ea2d85cee02c7a4ae5db8a5e780fc39ff9294ee483a074d4aba' "$E"
          grep -Fq '6a5a9e707b49c5c8c9f2f262f48e22de69a02dfad2888f149be394bd8c8632e9' "$E"
          grep -Fq 'Java_com_js8call_core_JS8Engine_nativeTransmitMessage' "$E"
          grep -Fq 'Java_com_js8call_core_JS8Engine_nativeSetTxReady' "$E"
