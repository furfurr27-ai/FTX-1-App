name: Finalize CP-0002C checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'native/wspr/**'
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/dsp/Wspr*.kt'
      - 'android/pipeline/src/test/kotlin/dev/n0png/fieldops/android/dsp/WsprRxTests.kt'
      - 'scripts/test_wspr_rx.sh'
      - 'scripts/test_js8_native.sh'
      - 'scripts/finalize_cp0002c.py'
      - 'research/wspr/CP-0002C_WSPR_RX_INTEGRATION.md'

permissions:
  contents: write

jobs:
  wspr-rx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kotlin compiler 1.9.22 and FFTW3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Verify exact pinned WSPR blobs
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r upstream expected vendored; do
            [[ "$upstream" == "UpstreamPath" ]] && continue
            actual="$(git hash-object "$vendored")"
            [[ "$actual" == "$expected" ]] || {
              echo "vendored blob mismatch: $vendored expected=$expected actual=$actual" >&2
              exit 1
            }
          done < native/wspr/UPSTREAM_BLOBS.tsv

      - name: Re-run focused CP-0002C WSPR RX gate on merged main
        shell: bash
        run: bash scripts/test_wspr_rx.sh

  js8-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kotlin compiler 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Re-run inherited JS8 RX/TX gate independently
        shell: bash
        run: bash scripts/test_js8_native.sh

  checkpoint:
    needs: [wspr-rx, js8-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0002c.py

      - name: Create immutable CP-0002C snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0002C-WSPR_NATIVE_RX \
            --parent CP-0002B-JS8_NATIVE_TX \
            --summary "Pinned WSPR receive decoder integrated from 12 kHz real FieldOps audio through 375 sps complex I/Q" \
            --phase "Native modes: JS8 RX/TX and WSPR RX host-integrated; WSPR TX next" \
            --test-status "GREEN host/CI: core=42062 pipeline=56 LoTW=19 WSPR_RX=22 JS8_RX=19 JS8_TX=39; exact pinned WSPR blobs verified; Android/device proof not run; finalizer run $FINALIZE_RUN_ID" \
            --source-pin "Guenael/rtlsdr-wsprd@1ca9b83dd2562ce9ef2453aacdd5bc3aab982c7d" \
            --completed "Exact pinned WSPR decoder sources vendored unchanged and Git blob identities verified in CI" \
            --completed "One 120-second 12 kHz real window converts to exactly 45,000 complex I/Q samples at 375 sps" \
            --completed "Pinned wspr_decode reached through a FieldOps JNI/native bridge with an explicit-stack decoder worker" \
            --completed "Pinned native K1JT FN20QI 20 encoder fixture synthesized at 12 kHz and recovered end-to-end as K1JT FN20 20" \
            --completed "Focused deterministic WSPR RX suite PASS 22 assertions" \
            --completed "Inherited JS8 RX PASS 19 and JS8 TX PASS 39 after WSPR integration" \
            --completed "Production WSPR adapter deliberately rejects TX until CP-0002D" \
            --blocker "Android arm64-v8a build/package of the WSPR decoder plus FFTW3 dependency has not been validated" \
            --blocker "Actual Samsung Galaxy S23 Ultra execution has not been tested" \
            --blocker "Actual Yaesu FTX-1 USB receive routing/levels and off-air WSPR decode have not been tested" \
            --next "CP-0002D: use pinned upstream channel-symbol encoder and synthesize the complete 12 kHz WSPR 4-FSK waveform" \
            --next "Prove 162 symbols, 8192 samples per symbol, 1.46484375 Hz spacing, 1327104 samples and 110.592 second duration" \
            --next "Route WSPR TX only through the FieldOps arbiter/PTT/audio path and prove TX0/audio-stop/ownership-release on failure or cancel"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0002C-WSPR_NATIVE_RX.json
          git add -f checkpoints/snapshots/CP-0002C-WSPR_NATIVE_RX.tar.gz
          git commit -m "Checkpoint CP-0002C WSPR native RX"
          git push
