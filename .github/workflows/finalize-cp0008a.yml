  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_core_regression.sh


  checkpoint:
    needs: [propagation-foundation, production-pack, geometry-providers, map-regression, extended-regression, service-regression, persistence-regression, projection-regression, target-regression, catalog-regression, award-regression, queue-regression, logger-regression, lotw-regression, core-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0008a.py

      - name: Create immutable CP-0008A snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0008A-PROPAGATION_INTELLIGENCE_FOUNDATION \
            --parent CP-0007C-US_STATE_GEOMETRY_PACK \
            --summary "Provider-neutral propagation intelligence domain with provenance/freshness/confidence, solar/geomagnetic and ionospheric context, heard-path evidence, modeled-path separation, explainable assessment, and offline snapshot/cache contracts" \
            --phase "Propagation intelligence foundation host-verified with synthetic evidence; NOAA SWPC public source adapter next; hardware/account checkpoints remain deferred by owner" \
            --test-status "GREEN host/CI: propagation=154 production_pack=363 geometry=102 map=96 extended=96 service=64 persistence=92 projection=114 target=77 catalog=115 award=67 queue=47 logger=78 LoTW_transaction=53 core=42062; finalizer run $FINALIZE_RUN_ID" \
            --completed "Provider-neutral propagation sources retain id/provider/class/version/retrieval UTC plus optional HTTPS source and terms URLs" \
            --completed "Evidence confidence basis/explanation, quality flags, explicit geography, and configurable FRESH/AGING/STALE/FUTURE_DATED freshness are host-verified" \
            --completed "Solar/geomagnetic context normalizes F10.7, planetary Kp/Ap, sunspot number, and X-ray flux without treating context as observed RF path evidence" \
            --completed "NOAA Kp>=5/G1 semantics are used only for an explainable geomagnetic-storm caution and never as standalone path proof" \
            --completed "Ionospheric map products support provider-neutral foF2/MUF/hmF2 samples with explicit MUF reference distance and provenance/coverage/time/quality/confidence metadata" \
            --completed "Heard/spot path observations remain separate from QSO/LoTW state and require explicit transmitter/receiver geography rather than callsign inference" \
            --completed "Modeled path estimates remain separate from observed paths and retain explicit endpoints, MUF/LUF limits, model input summary, provenance, quality, and confidence" \
            --completed "Explainable path assessment returns GOOD/MARGINAL/POOR/UNKNOWN with structured reasons and exact evidence ids; stale/future evidence is ignored for current decisions" \
            --completed "PropagationSnapshotStore defines offline save/latest/id/as-of/history semantics with deterministic conflict-safe host implementation" \
            --completed "Focused propagation PASS 154; production state pack PASS 363; geometry provider PASS 102; map PASS 96; extended catalog PASS 96; service PASS 64; persistence PASS 92; projection PASS 114; target PASS 77; catalog PASS 115; award PASS 67; queue PASS 47; logger PASS 78; LoTW transaction PASS 53; core PASS 42062" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return to CP-0003C until the owner explicitly says 'resume CP-0003C'" \
            --blocker "Skip any checkpoint requiring the phone, radio, real credentials/certificates, real accounts, RF testing, or other manual hardware validation; continue to the next GitHub/CI-only checkpoint" \
            --blocker "CP-0004A/B/C FTX-1 Android hardware checkpoints remain deferred and incomplete" \
            --blocker "CP-0008A uses deterministic synthetic propagation evidence only; live NOAA/GIRO/PSK Reporter/WSPRnet/HFcast/VOACAP integration remains unproven" \
            --blocker "GIRO/LGDC data has explicit licensing/access/acknowledgement constraints; no live GIRO integration is authorized or implied by this checkpoint" \
            --blocker "Android map rendering and on-device network/cache adapters remain later work" \
            --next "CP-0008B: pin exact official no-credential NOAA/SWPC planetary-Kp and F10.7 endpoints, captured schemas, units/timestamp semantics, and fixture hashes" \
            --next "Implement a transport-independent parser/normalizer into CP-0008A solar/geomagnetic evidence while preserving observed/estimated/forecast distinctions and provider timestamps" \
            --next "Keep current-value-dependent assertions, credentials, GIRO/PSK Reporter/WSPRnet/HFcast/VOACAP, Android rendering, and hardware work outside CP-0008B"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0008A-PROPAGATION_INTELLIGENCE_FOUNDATION.json
          git add -f checkpoints/snapshots/CP-0008A-PROPAGATION_INTELLIGENCE_FOUNDATION.tar.gz
          git commit -m "Checkpoint CP-0008A propagation intelligence foundation"
          git push
