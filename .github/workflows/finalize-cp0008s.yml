name: Finalize CP-0008S checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/PropagationOfflineReportDecoder.kt'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/PropagationOfflineReportSerialization.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/PropagationOfflineReportDecoderTests.kt'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/PropagationOfflineReportImportService.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/PropagationOfflineReportImportTests.kt'
      - 'research/propagation/CP-0008R_OFFLINE_REPORT_IMPORT_BOUNDARY.md'
      - 'scripts/test_propagation_offline_report_import.sh'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/PropagationOfflineReportComparisonService.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/PropagationOfflineReportComparisonTests.kt'
      - 'research/propagation/CP-0008S_OFFLINE_REPORT_INSPECTION_COMPARISON.md'
      - 'scripts/test_propagation_offline_report_comparison.sh'
      - 'research/propagation/CP-0008Q_OFFLINE_REPORT_DECODE_VALIDATION.md'
      - 'scripts/test_propagation_offline_report_decoder.sh'
      - 'scripts/finalize_cp0008s.py'
      - '.github/workflows/cp0008s-propagation-offline-import-inspection-comparison.yml'
      - '.github/workflows/finalize-cp0008s.yml'
      - '.github/workflows/finalize-cp0008r.yml'

permissions:
  contents: write

env:
  JAVA_OPTS: "-Xmx1536m -Xms128m"

jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_propagation_offline_report_comparison.sh

  inherited:
    name: inherited — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: import, script: scripts/test_propagation_offline_report_import.sh}
          - {label: decoder, script: scripts/test_propagation_offline_report_decoder.sh}
          - {label: serialization, script: scripts/test_propagation_offline_report_serialization.sh}
          - {label: offline-report, script: scripts/test_propagation_offline_diagnostic_report.sh}
          - {label: diagnostics, script: scripts/test_propagation_read_model_consistency.sh}
          - {label: operating-picture, script: scripts/test_propagation_operating_picture.sh}
          - {label: source-status, script: scripts/test_propagation_source_status_presentation.sh}
          - {label: state-persistence, script: scripts/test_propagation_refresh_state_persistence.sh}
          - {label: runtime, script: scripts/test_propagation_runtime_composition.sh}
          - {label: concrete-https, script: scripts/test_concrete_public_https_transport.sh}
          - {label: public-transport, script: scripts/test_public_propagation_transport_adapters.sh}
          - {label: refresh, script: scripts/test_propagation_refresh_coordinator.sh}
          - {label: projection, script: scripts/test_propagation_projection.sh}
          - {label: aggregation, script: scripts/test_propagation_aggregation_offline_cache.sh}
          - {label: psk-reporter, script: scripts/test_psk_reporter_heard_path_adapter.sh}
          - {label: glotec, script: scripts/test_glotec_ionospheric_adapter.sh}
          - {label: noaa-swpc, script: scripts/test_noaa_swpc_propagation_adapter.sh}
          - {label: propagation, script: scripts/test_propagation_foundation.sh}
          - {label: production-pack, script: scripts/test_production_us_state_geometry_pack.sh}
          - {label: geometry, script: scripts/test_award_geometry_providers.sh}
          - {label: map, script: scripts/test_award_area_map_projection.sh}
          - {label: extended, script: scripts/test_extended_award_catalog.sh}
          - {label: service, script: scripts/test_awards_center_application_service.sh}
          - {label: persistence, script: scripts/test_award_evidence_persistence.sh}
          - {label: awards-projection, script: scripts/test_awards_center_projection.sh}
          - {label: target, script: scripts/test_award_target_enrichment.sh}
          - {label: catalog, script: scripts/test_official_award_catalog.sh}
          - {label: award, script: scripts/test_award_evaluation.sh}
          - {label: queue, script: scripts/test_manual_qso_lotw_queue.sh}
          - {label: logger, script: scripts/test_universal_qso_logger.sh}
          - {label: lotw, script: scripts/test_lotw_transaction.sh}
          - {label: core, script: scripts/test_core_regression.sh}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash "${{ matrix.script }}"

  checkpoint:
    needs: [comparison, inherited]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Update durable handoff
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0008s.py
      - name: Create and verify immutable checkpoint
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0008S-PROPAGATION_OFFLINE_REPORT_INSPECTION_COMPARISON \
            --parent CP-0008R-PROPAGATION_OFFLINE_REPORT_IMPORT_BOUNDARY \
            --summary "Deterministic offline imported report comparison with full projection diffs and provenance" \
            --phase "Offline comparison CI-verified; canonical comparison export next; hardware deferred" \
            --test-status "GREEN host/CI: compare=PASS import=PASS decoder=PASS serialization=PASS inherited=PASS (33 CI test jobs); finalizer run $FINALIZE_RUN_ID" \
            --completed "Compare two fully validated imported canonical V1 reports without live reads, clocks or mutation" \
            --completed "Track sorted selected-view source/evidence changes, including complete projection value drift when index keys match" \
            --completed "Preserve before/after receipt hashes, source provenance and original query timestamp ordering" \
            --completed "Distinguish missing selected-view evidence from claims of source deletion, authenticated origin or live RF worsening" \
            --completed "Focused comparison plus CP-0008R/Q/P and all inherited CI regressions pass" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return until owner explicitly says 'resume CP-0003C'" \
            --blocker "CP-0004A/B/C hardware checkpoints remain incomplete" \
            --blocker "No authenticated report signature, cross-store atomicity, Android device or phone/radio/RF proof" \
            --next "CP-0008T: GitHub/CI-only canonical offline comparison export contract" \
            --next "Preserve CP-0008P/Q/R/S canonical import, comparison and provenance tests" \
            --next "CP-0003C remains DEFERRED; skip any manual account/hardware work"
          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit checkpoint
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0008S-PROPAGATION_OFFLINE_REPORT_INSPECTION_COMPARISON.json
          git add -f checkpoints/snapshots/CP-0008S-PROPAGATION_OFFLINE_REPORT_INSPECTION_COMPARISON.tar.gz
          git commit -m "Checkpoint CP-0008S offline imported report inspection and comparison"
          git push
