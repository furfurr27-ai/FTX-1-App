name: CP-0006F Awards Application Service

on:
  push:
    branches:
      - cp-0006f-awards-application-service
  pull_request:
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/awards/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/AwardsCenterApplicationServiceTests.kt'
      - 'scripts/test_awards_center_application_service.sh'
      - 'scripts/test_award_evidence_persistence.sh'
      - 'scripts/test_awards_center_projection.sh'
      - 'scripts/test_award_target_enrichment.sh'
      - 'scripts/test_official_award_catalog.sh'
      - 'scripts/test_award_evaluation.sh'
      - 'scripts/test_manual_qso_lotw_queue.sh'
      - 'scripts/test_universal_qso_logger.sh'
      - 'scripts/test_lotw_transaction.sh'
      - 'scripts/test_core_regression.sh'
      - 'scripts/finalize_cp0006f.py'
      - 'research/awards/CP-0006F_AWARDS_APPLICATION_SERVICE.md'
      - '.github/workflows/cp0006f-awards-application-service.yml'
      - '.github/workflows/finalize-cp0006f.yml'

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run focused CP-0006F application service gate
        run: bash scripts/test_awards_center_application_service.sh

      - name: Dry-run CP-0006F checkpoint handoff generator
        shell: bash
        env:
          FINALIZE_RUN_ID: premerge-dry-run
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/finalize_cp0006f.py
          python3 scripts/finalize_cp0006f.py
          grep -Fq 'CP-0006F-AWARDS_APPLICATION_SERVICE' README.md
          grep -Fq 'CP-0006G — Extended official award catalog and evaluator coverage' NEXT_ACTION.md
          grep -Fq 'CP-0006G-EXTENDED_AWARD_CATALOG' SOFTWARE_TRACK.md
          grep -Fq 'CP-0006F — Awards Center application service and evidence-ingestion orchestration' checkpoints/CHECKPOINT_HISTORY.md
          grep -Fq 'CP-0003C is **DEFERRED**' NEXT_ACTION.md
          grep -Fq 'Create immutable CP-0006F snapshot' .github/workflows/finalize-cp0006f.yml
          git diff --check

  persistence-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0006E persistence/import independently
        run: bash scripts/test_award_evidence_persistence.sh

  projection-regression:
