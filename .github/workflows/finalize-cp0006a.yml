name: Finalize CP-0006A checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/awards/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/AwardEvaluationTests.kt'
      - 'scripts/test_award_evaluation.sh'
      - 'scripts/finalize_cp0006a.py'
      - 'research/awards/CP-0006A_AWARD_EVALUATION_ENGINE.md'
      - '.github/workflows/finalize-cp0006a.yml'

permissions:
  contents: write

jobs:
  award:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0006A award gate on merged main
        run: bash scripts/test_award_evaluation.sh

  queue-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0005B queue regression
        run: bash scripts/test_manual_qso_lotw_queue.sh

  logger-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0005A universal logger regression
        run: bash scripts/test_universal_qso_logger.sh

  lotw-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0003B LoTW transaction regression
        run: bash scripts/test_lotw_transaction.sh

  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run inherited core regression
        run: bash scripts/test_core_regression.sh

  checkpoint:
    needs: [award, queue-regression, logger-regression, lotw-regression, core-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0006a.py

      - name: Create immutable CP-0006A snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0006A-AWARD_EVALUATION_ENGINE \
            --parent CP-0005B-MANUAL_QSO_LOTW_QUEUE \
            --summary "Provider-independent award evaluator with explicit worked/confirmed/threshold/official-claimability states, controlled mode grouping, and band/all-band filtering" \
            --phase "Award evaluation engine host-verified; official award rules/catalog next; hardware/account checkpoints remain deferred by owner" \
            --test-status "GREEN host/CI: award=67 queue=47 logger=78 LoTW_transaction=53 core=42062; finalizer run $FINALIZE_RUN_ID" \
            --completed "Provider-independent award-domain model exposes WORKED, CONFIRMED, THRESHOLD_MET and OFFICIALLY_CLAIMABLE as distinct states" \
            --completed "Confirmation source/evidence is explicit and worked QSOs are not silently promoted to confirmed" \
            --completed "Controlled award-mode grouping is separate from and preserves exact QSO MODE/SUBMODE" \
            --completed "Band-scoped and all-band evaluation uses filters without rewriting authoritative QSO records" \
            --completed "Distinct-target thresholds support WORKED or CONFIRMED basis and optional remaining-target universes" \
            --completed "Local threshold completion cannot imply official sponsor claimability without an explicit claimability evaluator" \
            --completed "CP-0006A contains synthetic/generic definitions only and 67 focused award assertions pass" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return to CP-0003C until the owner explicitly says 'resume CP-0003C'" \
            --blocker "Skip any checkpoint requiring the phone, radio, real credentials/certificates, real accounts, RF testing, or other manual hardware validation; continue to the next GitHub/CI-only checkpoint" \
            --blocker "CP-0004A/B/C FTX-1 Android hardware checkpoints remain deferred and incomplete" \
            --blocker "Official sponsor award rules/claim links are not encoded until CP-0006B verifies official sources" \
            --next "CP-0006B: verify official award rules/claim links from issuing organizations and encode a versioned catalog on top of CP-0006A" \
            --next "Do not attempt real award-account login or claim submission; skip any later phone/radio/credential/account/RF/manual-hardware checkpoint under the owner override"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0006A-AWARD_EVALUATION_ENGINE.json
          git add -f checkpoints/snapshots/CP-0006A-AWARD_EVALUATION_ENGINE.tar.gz
          git commit -m "Checkpoint CP-0006A award evaluation engine"
          git push
