          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_universal_qso_logger.sh

  lotw-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_lotw_transaction.sh

  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_core_regression.sh


  checkpoint:
    needs: [production-pack, geometry-providers, map-regression, extended-regression, service-regression, persistence-regression, projection-regression, target-regression, catalog-regression, award-regression, queue-regression, logger-regression, lotw-regression, core-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0007c.py

      - name: Create immutable CP-0007C snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0007C-US_STATE_GEOMETRY_PACK \
            --parent CP-0007B-AWARD_GEOMETRY_PROVIDERS \
            --summary "Production 50-state WAS offline geometry pack generated deterministically from the pinned official Census 2025 national States 1:20,000,000 KML artifact" \
            --phase "Production WAS state geometry pack host-verified; propagation intelligence domain foundation next; hardware/account checkpoints remain deferred by owner" \
            --test-status "GREEN host/CI: production_pack=363 geometry=102 map=96 extended=96 service=64 persistence=92 projection=114 target=77 catalog=115 award=67 queue=47 logger=78 LoTW_transaction=53 core=42062; finalizer run $FINALIZE_RUN_ID" \
            --completed "Official Census artifact cb_2025_us_state_20m.zip is pinned at 158017 bytes with SHA-256 efddd884f1442ef233b1ba9c12dddbd66b6fdf94da6a373e1556aefe3dbc5751" \
            --completed "Builder converts the 52 upstream placemarks into exactly the verified 50 ARRL WAS state identities and excludes non-WAS state/equivalent records" \
            --completed "Production offline geometry asset is 324531 bytes with canonical SHA-256 5feb8c18688936a526523cb536766130be06b14ebfa918b3d99e39bfbcb0a130 plus deterministic per-state feature hashes" \
            --completed "Census multipart/island geometry is preserved, including Alaska 47 polygons and geometry on both longitude signs with maximum adjacent ring longitude jump 0.980542000000014 degrees" \
            --completed "Build fails on unsplit antimeridian ring segments greater than 180 degrees and performs no clipping or implicit dateline wrapping" \
            --completed "CI re-downloads the exact Census artifact, verifies upstream hash/size, regenerates pack/metadata, and byte-compares generated artifacts with committed production files" \
            --completed "Runtime loader verifies raw pack SHA, exact 50-state identity set, feature hashes, polygon counts, sorted order, and canonical full-pack SHA before exposing geometry" \
            --completed "All 50 WAS states bind production Census geometry; all 488 FFMA grids remain bound to deterministic IARU geometry; runtime provider remains offline/platform/account/hardware independent" \
            --completed "Focused production pack PASS 363; geometry provider PASS 102; map PASS 96; extended catalog PASS 96; service PASS 64; persistence PASS 92; projection PASS 114; target PASS 77; catalog PASS 115; award PASS 67; queue PASS 47; logger PASS 78; LoTW transaction PASS 53; core PASS 42062" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return to CP-0003C until the owner explicitly says 'resume CP-0003C'" \
            --blocker "Skip any checkpoint requiring the phone, radio, real credentials/certificates, real accounts, RF testing, or other manual hardware validation; continue to the next GitHub/CI-only checkpoint" \
            --blocker "CP-0004A/B/C FTX-1 Android hardware checkpoints remain deferred and incomplete" \
            --blocker "Android map rendering, offline basemap tiles, DXCC/CQ/ITU/IOTA/POTA/SOTA geometry, propagation data, and live/heard map layers remain later work" \
            --next "CP-0008A: define provider-neutral propagation observations/snapshots, provenance/freshness/confidence, solar/geomagnetic and ionospheric product models, and normalized heard/spot path evidence" \
            --next "Add explainable band/path usability assessment and offline snapshot/cache interfaces using deterministic synthetic CI fixtures only" \
            --next "Keep credentialed live-provider integration and Android map rendering separately gated; continue skipping phone/radio/credential/account/RF/manual-hardware checkpoints"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0007C-US_STATE_GEOMETRY_PACK.json
          git add -f checkpoints/snapshots/CP-0007C-US_STATE_GEOMETRY_PACK.tar.gz
          git commit -m "Checkpoint CP-0007C production U.S. state geometry pack"
          git push
