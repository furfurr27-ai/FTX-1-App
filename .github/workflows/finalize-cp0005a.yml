name: Finalize CP-0005A checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/logbook/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/**'
      - 'scripts/test_universal_qso_logger.sh'
      - 'scripts/test_lotw_transaction.sh'
      - 'scripts/test_core_regression.sh'
      - 'scripts/finalize_cp0005a.py'
      - 'research/logbook/**'
      - 'README.md'
      - 'NEXT_ACTION.md'
      - 'SOFTWARE_TRACK.md'
      - '.github/workflows/finalize-cp0005a.yml'

permissions:
  contents: write

jobs:
  logger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0005A logger gate on merged main
        run: bash scripts/test_universal_qso_logger.sh

  lotw-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0003B LoTW transaction gate on merged main
        run: bash scripts/test_lotw_transaction.sh

  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run inherited core regression on merged main
        run: bash scripts/test_core_regression.sh

  checkpoint:
    needs: [logger, lotw-regression, core-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0005a.py

      - name: Create immutable CP-0005A snapshot
        shell: bash
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py             --root .             --id CP-0005A-UNIVERSAL_QSO_LOGGER             --parent CP-0003B-LOTW_TRANSACTION_SAFE             --summary "Universal local QSO model plus fast manual SSB/CW logger and completed-contact digital auto-log adapters"             --phase "Universal QSO/logger host-verified; manual-QSO LoTW queue policy next; hardware/account checkpoints remain deferred"             --test-status "GREEN host/CI: logger=78 LoTW_transaction=53 core=42062 pipeline=56 LoTW=19; CP-0003C and CP-0004A/B/C remain hardware/account gated; finalizer run $FINALIZE_RUN_ID"             --source-pin "mbridak/not1mm@72fbc5e270af1956f10f8a83c676c46449ad7ced"             --source-pin "ham2k/polo.ham2k.com@7f99987f64c7936853d7e4cc9194dc4717481fa3"             --source-pin "foldynl/QLog@cbb75f2f2555a4a84c9761e38075754f4821c27c"             --source-pin "ea4k/klog@6819f98a5e8542e3dc657f2048cf3d305c1c7d10"             --completed "QsoRecord extended as the authoritative universal local QSO model while preserving CP-0003B compatibility"             --completed "Exact ADIF mode/submode and exact physical radio mode are preserved independently"             --completed "Exact Hz frequency, band, UTC start/end, callsign, reports, station/remote location, station profile and session are preserved"             --completed "OperatingSession model added above individual QSOs"             --completed "Fast manual SSB/CW logger added using current session and radio context without fabricated RST defaults"             --completed "Completed-contact digital auto-log adapter added with explicit provider-supplied mode/submode identity and incomplete-contact rejection"             --completed "ADIF export preserves SUBMODE, exact FREQ, UTC end fields, grids and reports"             --completed "Focused logger PASS 78; LoTW transaction PASS 53; inherited core PASS 42062, pipeline PASS 56 and LoTW PASS 19"             --blocker "CP-0003C real LoTW validation remains hardware/account gated and incomplete"             --blocker "CP-0004A/B/C FTX-1 Android hardware checkpoints remain incomplete"             --blocker "Room persistence and Compose logger UI remain later app-shell/UI work"             --blocker "Automatic manual-QSO LoTW enqueue is intentionally not included until CP-0005B"             --next "CP-0005B: add optional idempotent logger-save -> LotwUploadQueue policy for SSB/CW and eligible digital QSOs without coupling local save to network success"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0005A-UNIVERSAL_QSO_LOGGER.json
          git add -f checkpoints/snapshots/CP-0005A-UNIVERSAL_QSO_LOGGER.tar.gz
          git commit -m "Checkpoint CP-0005A universal QSO logger"
          git push
