name: Finalize CP-0008P checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/PropagationOfflineReportSerialization.kt'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/propagation/PropagationRuntime.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/PropagationOfflineReportSerializationTests.kt'
      - 'research/propagation/CP-0008P_OFFLINE_REPORT_SERIALIZATION_CONTRACT.md'
      - 'scripts/test_propagation_offline_report_serialization.sh'
      - 'scripts/finalize_cp0008p.py'
      - '.github/workflows/cp0008p-propagation-offline-report-serialization.yml'
      - '.github/workflows/finalize-cp0008p.yml'
      - '.github/workflows/finalize-cp0008o.yml'

permissions:
  contents: write

env:
  JAVA_OPTS: "-Xmx1536m -Xms128m"

jobs:
  serialization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_propagation_offline_report_serialization.sh

  inherited:
    name: inherited — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: offline-report, script: scripts/test_propagation_offline_diagnostic_report.sh}
          - {label: diagnostics, script: scripts/test_propagation_read_model_consistency.sh}
          - {label: operating-picture, script: scripts/test_propagation_operating_picture.sh}
          - {label: source-status, script: scripts/test_propagation_source_status_presentation.sh}
          - {label: state-persistence, script: scripts/test_propagation_refresh_state_persistence.sh}
          - {label: runtime, script: scripts/test_propagation_runtime_composition.sh}
          - {label: concrete-https, script: scripts/test_concrete_public_https_transport.sh}
          - {label: public-transport, script: scripts/test_public_propagation_transport_adapters.sh}
          - {label: refresh, script: scripts/test_propagation_refresh_coordinator.sh}
          - {label: projection, script: scripts/test_propagation_projection.sh}
          - {label: aggregation, script: scripts/test_propagation_aggregation_offline_cache.sh}
          - {label: psk-reporter, script: scripts/test_psk_reporter_heard_path_adapter.sh}
          - {label: glotec, script: scripts/test_glotec_ionospheric_adapter.sh}
          - {label: noaa-swpc, script: scripts/test_noaa_swpc_propagation_adapter.sh}
          - {label: propagation, script: scripts/test_propagation_foundation.sh}
          - {label: production-pack, script: scripts/test_production_us_state_geometry_pack.sh}
          - {label: geometry, script: scripts/test_award_geometry_providers.sh}
          - {label: map, script: scripts/test_award_area_map_projection.sh}
          - {label: extended, script: scripts/test_extended_award_catalog.sh}
          - {label: service, script: scripts/test_awards_center_application_service.sh}
          - {label: persistence, script: scripts/test_award_evidence_persistence.sh}
          - {label: awards-projection, script: scripts/test_awards_center_projection.sh}
          - {label: target, script: scripts/test_award_target_enrichment.sh}
          - {label: catalog, script: scripts/test_official_award_catalog.sh}
          - {label: award, script: scripts/test_award_evaluation.sh}
          - {label: queue, script: scripts/test_manual_qso_lotw_queue.sh}
          - {label: logger, script: scripts/test_universal_qso_logger.sh}
          - {label: lotw, script: scripts/test_lotw_transaction.sh}
          - {label: core, script: scripts/test_core_regression.sh}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash "${{ matrix.script }}"

  checkpoint:
    needs: [serialization, inherited]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Update durable handoff
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0008p.py
      - name: Create and verify immutable checkpoint
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0008P-PROPAGATION_OFFLINE_REPORT_SERIALIZATION_CONTRACT \
            --parent CP-0008O-PROPAGATION_OFFLINE_DIAGNOSTIC_REPORT_PAYLOAD \
            --summary "Versioned canonical JSON UTF-8 offline serialization of complete propagation diagnostic report" \
            --phase "Propagation offline serialization contract host-verified; strict decode validation next; hardware/account deferred" \
            --test-status "GREEN host/CI: serialization=PASS offline_report=PASS read_model_diagnostics=PASS operating_picture=PASS source_status=67 state_persistence=PASS runtime=67 concrete_https=70 public_transport=98 refresh=112 projection=79 aggregation=101 pskr=168 glotec=87 noaa=53 propagation=154 production_pack=363 geometry=102 map=96 extended=96 service=64 persistence=92 awards_projection=114 target=77 catalog=115 award=67 queue=47 logger=78 LoTW_transaction=53 core=42062; finalizer run $FINALIZE_RUN_ID" \
            --completed "Versioned canonical JSON UTF-8 serializer exports every nested CP-0008O diagnostic report field without new store reads" \
            --completed "Deterministic root/field/map/set ordering, original ordered lists, exact nullable UTC millisecond timestamps and enum provenance" \
            --completed "Unicode/JSON escaping, nonfinite number and unpaired surrogate rejection, bounded output/depth/collections" \
            --completed "SHA-256 checksum and byte-count metadata with deterministic re-serialization integrity verification, no claim of authenticity" \
            --completed "Source summary/time and evidence-index checks reject corrupted output or fabricated atomic snapshot consistency" \
            --completed "Runtime in-memory serialization overloads verified against deterministic file-backed restart with no network or persisted mutation" \
            --completed "Superseded CP-0008O finalizer manual-only; focused plus full inherited CI successful" \
            --blocker "OWNER OVERRIDE: CP-0003C is DEFERRED; do not return until owner explicitly says 'resume CP-0003C'" \
            --blocker "CP-0004A/B/C hardware checkpoints remain incomplete" \
            --blocker "JSON deserialization not built; cross-store atomicity not verified; no Android UI/lifecycle or phone/radio/RF proof" \
            --next "CP-0008Q: strict bounded offline report JSON decode and validation" \
            --next "Preserve complete source/evidence/clock fidelity and repeat full inherited deterministic CI" \
            --next "Keep account and hardware work outside; CP-0003C remains DEFERRED"
          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit checkpoint
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md SOFTWARE_TRACK.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0008P-PROPAGATION_OFFLINE_REPORT_SERIALIZATION_CONTRACT.json
          git add -f checkpoints/snapshots/CP-0008P-PROPAGATION_OFFLINE_REPORT_SERIALIZATION_CONTRACT.tar.gz
          git commit -m "Checkpoint CP-0008P propagation offline report serialization contract"
          git push
