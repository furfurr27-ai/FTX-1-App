name: Finalize CP-0003C checkpoint

on:
  push:
    branches:
      - main
    paths:
      - 'android/pipeline/src/main/kotlin/dev/n0png/fieldops/android/logbook/**'
      - 'android/pipeline/src/test/kotlin/dev/n0png/fieldops/android/logbook/**'
      - 'android/validation-app/**'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/logbook/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/**'
      - 'native/tqsl/**'
      - 'scripts/build_tqsl_android_arm64.sh'
      - 'scripts/check_cp0003c_secret_hygiene.sh'
      - 'scripts/test_tqsl_signer.sh'
      - 'scripts/test_lotw_transaction.sh'
      - 'scripts/test_core_regression.sh'
      - 'scripts/validate_cp0003c_device_evidence.py'
      - 'scripts/finalize_cp0003c.py'
      - 'research/tqsl/CP-0003C_DEVICE_EVIDENCE.txt'
      - 'research/tqsl/CP-0003C_APK_BASELINE.json'
      - 'research/tqsl/CP-0003C_DEVICE_VALIDATION.md'
      - '.github/workflows/finalize-cp0003c.yml'

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sanitized S23 Ultra device evidence
        run: python3 scripts/validate_cp0003c_device_evidence.py

  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-run CP-0003C secret-hygiene gate
        run: bash scripts/check_cp0003c_secret_hygiene.sh

  signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install signer test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libexpat1-dev
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run TrustedQSL signer regression
        run: bash scripts/test_tqsl_signer.sh

  transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run transaction-safe LoTW regression
        run: bash scripts/test_lotw_transaction.sh

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run inherited core/LoTW regression
        run: bash scripts/test_core_regression.sh

  android-package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build perl zip
      - name: Rebuild official TrustedQSL Android arm64-v8a package
        run: bash scripts/build_tqsl_android_arm64.sh

  checkpoint:
    needs: [evidence, secret-hygiene, signer, transaction, core, android-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable handoff documents
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/finalize_cp0003c.py

      - name: Create immutable CP-0003C snapshot
        env:
          FINALIZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BASE_SOURCE="$(python3 -c 'import json; print(json.load(open("research/tqsl/CP-0003C_APK_BASELINE.json"))["source_sha"])')"
          BASE_APK="$(python3 -c 'import json; print(json.load(open("research/tqsl/CP-0003C_APK_BASELINE.json"))["apk_sha256"])')"

          python3 scripts/create_checkpoint.py \
            --root . \
            --id CP-0003C-REAL_LOTW_VALIDATED \
            --parent CP-0003B-LOTW_TRANSACTION_SAFE \
            --summary "Real Galaxy S23 Ultra TrustedQSL signing and one-QSO LoTW acceptance/confirmation-query validation" \
            --phase "LoTW real-device validation complete; FTX-1 CAT USB port next" \
            --test-status "GREEN: signer=56 transaction=53 core=42062 pipeline=56 LoTW=19 Android-package=PASS secret-hygiene=PASS S23-device-evidence=PASS; finalizer run $FINALIZE_RUN_ID" \
            --source-pin "TrustedQSL-2.8.6@sha256:182e5f2ac35a3db8b409b45d96505e6bd265ae4668ed064754209c4b8e7bdf37" \
            --source-pin "CP-0003C-validation-apk-source@$BASE_SOURCE" \
            --source-pin "CP-0003C-validation-apk-sha256:$BASE_APK" \
            --completed "Official TrustedQSL 2.8.6 reproducibly builds for Android arm64-v8a/AArch64 with static third-party dependency closure" \
            --completed "Real TQSL backup restored Callsign Certificates/private keys and Station Locations on the Galaxy S23 Ultra" \
            --completed "Real signing-only gate produced TQ8 on-device and rolled duplicate state back without upload" \
            --completed "One genuine QSO completed sign -> upload -> accepted-QSO report verification -> TrustedQSL commit" \
            --completed "Authenticated LoTW confirmation-report query succeeded and parsed after the live upload" \
            --completed "Sanitized device evidence passed the fail-closed validator" \
            --completed "Repository secret-hygiene gate passed with automatic upload still disabled" \
            --completed "Final regressions PASS: signer 56, transaction 53, core 42062, pipeline 56, LoTW 19" \
            --blocker "Automatic LoTW upload remains intentionally disabled pending a later explicit product checkpoint" \
            --next "CP-0004A: resolve the actual FTX-1 Enhanced CAT USB serial interface on Android" \
            --next "Start CAT with RTS/DTR deasserted and prove connect cannot key PTT" \
            --next "Prove CAT readback and USB detach/read/write failure -> emergency RX"

          python3 scripts/verify_checkpoint.py --root . --latest

      - name: Commit immutable checkpoint and handoff
        run: |
          set -euo pipefail
          git config user.name "fieldops-checkpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md VERSION NEXT_ACTION.md checkpoints/CHECKPOINT_HISTORY.md
          git add checkpoints/LATEST.json checkpoints/CURRENT_STATE.json checkpoints/RESUME_HERE.md
          git add checkpoints/manifests/CP-0003C-REAL_LOTW_VALIDATED.json
          git add -f checkpoints/snapshots/CP-0003C-REAL_LOTW_VALIDATED.tar.gz
          git commit -m "Checkpoint CP-0003C real LoTW validation"
          git push
