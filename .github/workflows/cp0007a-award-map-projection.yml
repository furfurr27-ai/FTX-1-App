name: CP-0007A Award Map Projection

on:
  push:
    branches:
      - cp-0007a-award-map-projection
  pull_request:
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/map/**'
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/awards/AwardsCenterApplicationService.kt'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/AwardAreaMapProjectionTests.kt'
      - 'scripts/test_award_area_map_projection.sh'
      - 'scripts/test_extended_award_catalog.sh'
      - 'scripts/test_awards_center_application_service.sh'
      - 'scripts/test_award_evidence_persistence.sh'
      - 'scripts/test_awards_center_projection.sh'
      - 'scripts/test_award_target_enrichment.sh'
      - 'scripts/test_official_award_catalog.sh'
      - 'scripts/test_award_evaluation.sh'
      - 'scripts/test_manual_qso_lotw_queue.sh'
      - 'scripts/test_universal_qso_logger.sh'
      - 'scripts/test_lotw_transaction.sh'
      - 'scripts/test_core_regression.sh'
      - 'scripts/finalize_cp0007a.py'
      - 'research/maps/CP-0007A_AWARD_MAP_PROJECTION.md'
      - '.github/workflows/cp0007a-award-map-projection.yml'
      - '.github/workflows/finalize-cp0007a.yml'

permissions:
  contents: read

jobs:
  map-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run focused CP-0007A map projection gate
        run: bash scripts/test_award_area_map_projection.sh

      - name: Dry-run CP-0007A checkpoint handoff generator
        shell: bash
        env:
          FINALIZE_RUN_ID: premerge-dry-run
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/finalize_cp0007a.py
          python3 scripts/finalize_cp0007a.py
          grep -Fq 'CP-0007A-AWARD_MAP_PROJECTION' README.md
          grep -Fq 'CP-0007B — Award geometry providers and offline geometry-pack contract' NEXT_ACTION.md
          grep -Fq 'CP-0007B-AWARD_GEOMETRY_PROVIDERS' SOFTWARE_TRACK.md
          grep -Fq 'CP-0007A — Award-area map projection foundation' checkpoints/CHECKPOINT_HISTORY.md
          grep -Fq 'CP-0003C is **DEFERRED**' NEXT_ACTION.md
          grep -Fq 'Create immutable CP-0007A snapshot' .github/workflows/finalize-cp0007a.yml
          git diff --check

  extended-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Kotlin 1.9.22
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/test_extended_award_catalog.sh

  service-regression:
