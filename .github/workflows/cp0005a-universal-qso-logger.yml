name: CP-0005A Universal QSO Logger

on:
  push:
    branches:
      - cp-0005a-universal-qso-logger
  pull_request:
    paths:
      - 'core/src/main/kotlin/dev/n0png/fieldops/core/logbook/**'
      - 'core/src/test/kotlin/dev/n0png/fieldops/core/**'
      - 'scripts/test_universal_qso_logger.sh'
      - 'scripts/test_lotw_transaction.sh'
      - 'scripts/test_core_regression.sh'
      - 'README.md'
      - 'NEXT_ACTION.md'
      - 'SOFTWARE_TRACK.md'
      - 'research/logbook/**'
      - 'scripts/finalize_cp0005a.py'
      - '.github/workflows/cp0005a-universal-qso-logger.yml'

permissions:
  contents: read

jobs:
  logger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run focused CP-0005A logger gate
        run: bash scripts/test_universal_qso_logger.sh

      - name: Dry-run CP-0005A checkpoint handoff generator
        shell: bash
        env:
          FINALIZE_RUN_ID: premerge-dry-run
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/finalize_cp0005a.py
          python3 scripts/finalize_cp0005a.py
          grep -Fq 'CP-0005A-UNIVERSAL_QSO_LOGGER' README.md
          grep -Fq 'CP-0005B — Manual-QSO LoTW queue' NEXT_ACTION.md
          grep -Fq 'CP-0005B-MANUAL_QSO_LOTW_QUEUE' SOFTWARE_TRACK.md
          grep -Fq 'CP-0005A — Universal QSO model + fast logger' checkpoints/CHECKPOINT_HISTORY.md
          git diff --check

  lotw-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run CP-0003B LoTW transaction gate independently
        run: bash scripts/test_lotw_transaction.sh

  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin 1.9.22
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip             https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Re-run inherited core regression independently
        run: bash scripts/test_core_regression.sh
